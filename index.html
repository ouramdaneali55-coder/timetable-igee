<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Emploi du temps — IGEE</title>
<style>
:root{
  --bg:#f4f6fb; --card:#fff; --text:#1a2238; --muted:#6b7a99;
  --border:#e3e8f0; --accent:#2d6cdf; --accent2:#1e4fa8;
  --lect:#e8f0ff; --lect-b:#2d6cdf;
  --lab:#e8fff3; --lab-b:#16a34a;
  --rec:#fff4e6; --rec-b:#ea8a1f;
  --shadow:0 2px 8px rgba(20,40,90,.06);
}
[data-theme="dark"]{
  --bg:#0f1626; --card:#1a2338; --text:#e8eefb; --muted:#93a3c0;
  --border:#2a3654; --accent:#5b8def; --accent2:#3a6fd8;
  --lect:#1e2a44; --lect-b:#5b8def;
  --lab:#1a3a2a; --lab-b:#4ade80;
  --rec:#3a2a1a; --rec-b:#fb923c;
  --shadow:0 2px 10px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;transition:background .25s,color .25s}
.hidden{display:none!important}
header{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;padding:16px 24px;position:sticky;top:0;z-index:50;box-shadow:0 2px 12px rgba(0,0,0,.15)}
.hd{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;max-width:1500px;margin:0 auto}
.logo{display:flex;align-items:center;gap:12px}
.ico{width:56px;height:56px;background:transparent;border-radius:50%;display:flex;align-items:center;justify-content:center;overflow:hidden}
.ico img{width:100%;height:100%;object-fit:contain}
.logo h1{font-size:1.15rem;font-weight:700}
.logo p{font-size:.8rem;opacity:.85}
.hd-actions{display:flex;gap:8px;flex-wrap:wrap}
.hd-actions button{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);color:#fff;padding:8px 14px;border-radius:8px;cursor:pointer;font-size:.85rem;transition:.2s;display:flex;align-items:center;gap:6px}
.hd-actions button:hover{background:rgba(255,255,255,.28)}
.container{max-width:1500px;margin:0 auto;padding:20px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
.stat .lbl{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.stat .val{font-size:1.6rem;font-weight:700;color:var(--accent);margin-top:4px}
.filters{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:18px;box-shadow:var(--shadow);display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.filters input,.filters select{padding:9px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:.9rem;width:100%}
.filters input:focus,.filters select:focus{outline:2px solid var(--accent);border-color:transparent}
.filters button{padding:9px 16px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600}
.filters button:hover{background:var(--accent2)}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.qb{padding:7px 16px;border-radius:20px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;font-size:.85rem;font-weight:600;transition:.2s}
.qb:hover{border-color:var(--accent);color:var(--accent)}
.qb.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.view-switch{display:flex;gap:0;margin-bottom:16px;background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;width:fit-content}
.view-switch button{padding:9px 20px;border:none;background:transparent;color:var(--muted);cursor:pointer;font-weight:600;font-size:.88rem}
.view-switch button.active{background:var(--accent);color:#fff}
.grid-wrap{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:auto;box-shadow:var(--shadow)}
.gh,.gr{display:grid;grid-template-columns:110px repeat(6,minmax(170px,1fr));min-width:1130px}
.gh{background:var(--accent);color:#fff;font-weight:600;font-size:.82rem;position:sticky;top:0;z-index:5}
.gh>div{padding:12px 8px;text-align:center;border-right:1px solid rgba(255,255,255,.15)}
.gr{border-bottom:1px solid var(--border)}
.gr:last-child{border-bottom:none}
.gc{padding:8px;border-right:1px solid var(--border);min-height:90px}
.gc.tc{background:var(--bg);font-weight:700;font-size:.82rem;color:var(--muted);display:flex;align-items:center;justify-content:center;text-align:center}
.sess{border-radius:8px;padding:8px;margin-bottom:6px;cursor:pointer;border-left:4px solid;font-size:.78rem;transition:transform .15s,box-shadow .15s}
.sess:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.12)}
.sess .tb{display:inline-block;font-size:.68rem;font-weight:700;padding:1px 6px;border-radius:4px;background:rgba(0,0,0,.08);margin-bottom:3px}
.sess .m{display:block;font-weight:700;font-size:.85rem}
.sess .s,.sess .e{display:block;font-size:.72rem;color:var(--muted);margin-top:2px}
.t-LECT{background:var(--lect);border-color:var(--lect-b)}
.t-LAB{background:var(--lab);border-color:var(--lab-b)}
.t-REC{background:var(--rec);border-color:var(--rec-b)}
.lv{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.li{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.li:hover{transform:translateY(-2px);border-color:var(--accent)}
.li .jb{font-size:.75rem;color:var(--accent);font-weight:700}
.li .hh{font-size:.75rem;color:var(--muted);margin-bottom:6px}
.li .mm{font-weight:700;font-size:.95rem;margin-bottom:4px}
.li .ss,.li .ee{font-size:.82rem;color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(10,20,40,.6);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.modal.hidden{display:none}
.modal-content{background:var(--card);border-radius:16px;max-width:480px;width:100%;padding:24px;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.3);max-height:90vh;overflow:auto}
.modal-close{position:absolute;top:12px;right:12px;background:transparent;border:none;font-size:1.6rem;cursor:pointer;color:var(--muted);line-height:1}
.modal-content h2{font-size:1.3rem;margin-bottom:16px;color:var(--accent);padding-right:30px}
.modal-content .row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:.9rem}
.modal-content .row:last-child{border-bottom:none}
.modal-content .l{color:var(--muted);font-weight:600}
.modal-content .v{font-weight:600;text-align:right}
@media print{
  header,.filters,.quick,.view-switch,.stats,.modal{display:none!important}
  .grid-wrap{border:none;box-shadow:none}
  .gh{position:relative!important}
  .sess{cursor:default}
}
@media(max-width:600px){
  header{padding:12px 14px}
  .hd{gap:8px}
  .logo{gap:9px}
  .ico{width:48px;height:48px}
  .container{padding:12px}
  .logo h1{font-size:1rem}
  .logo p{font-size:.72rem}
}
</style>
</head>
<body>

<header>
  <div class="hd">
    <div class="logo">
      <div class="ico"><img src="https://igee.univ-boumerdes.dz/wp-content/uploads/2021/09/logo-igee.png" alt="IGEE" onerror="this.style.display='none'"></div>
      <div>
        <h1>Emploi du temps — IGEE</h1>
        <p>Institut de Génie Électrique et Électronique</p>
      </div>
    </div>
    <div class="hd-actions">
      <button id="themeToggle">🌓 Thème</button>
      <button id="printBtn">🖨️ Imprimer</button>
      <button id="shareBtn">🔗 Partager</button>
    </div>
  </div>
</header>

<div class="container">
  <div class="stats">
    <div class="stat"><div class="lbl">Total séances</div><div class="val" id="statTotal">0</div></div>
    <div class="stat"><div class="lbl">Séances filtrées</div><div class="val" id="statFiltered">0</div></div>
    <div class="stat"><div class="lbl">Matières</div><div class="val" id="statMatieres">0</div></div>
    <div class="stat"><div class="lbl">Enseignants</div><div class="val" id="statEnseignants">0</div></div>
  </div>

  <div class="quick">
    <button class="qb active" data-quick-level="">Tous</button>
    <button class="qb" data-quick-level="L1">L1</button>
    <button class="qb" data-quick-level="L2">L2</button>
    <button class="qb" data-quick-level="L3">L3</button>
    <button class="qb" data-quick-level="M1">M1</button>
    <button class="qb" data-quick-level="M2">M2</button>
  </div>

  <div class="filters">
    <select id="filterNiveau">
      <option value="">Tous les niveaux</option>
      <option value="L1">L1</option>
      <option value="L2">L2</option>
      <option value="L3">L3</option>
      <option value="M1">M1</option>
      <option value="M2">M2</option>
    </select>
    <select id="filterFiliere"><option value="">Toutes les filières</option></select>
    <select id="filterGroupe"><option value="">Tous les groupes</option></select>
    <select id="filterJour">
      <option value="">Tous les jours</option>
      <option>Samedi</option><option>Dimanche</option><option>Lundi</option>
      <option>Mardi</option><option>Mercredi</option><option>Jeudi</option>
    </select>
    <input type="text" id="filterRecherche" placeholder="🔍 Matière, salle, enseignant...">
    <button id="resetBtn">Réinitialiser</button>
  </div>

  <div class="view-switch">
    <button id="viewGrid" class="active">📅 Grille</button>
    <button id="viewList">📋 Liste</button>
  </div>

  <div id="gridView">
    <div class="grid-wrap">
      <div class="gh">
        <div>Créneau</div>
        <div>Samedi</div><div>Dimanche</div><div>Lundi</div>
        <div>Mardi</div><div>Mercredi</div><div>Jeudi</div>
      </div>
      <div id="gridBody"></div>
    </div>
  </div>

  <div id="listView" class="hidden">
    <div id="listBody"></div>
  </div>
</div>

<div id="modal" class="modal hidden">
  <div class="modal-content">
    <button class="modal-close" id="modalClose">×</button>
    <div id="modalBody"></div>
  </div>
</div>

<script>
const NIVEAUX = ['L1','L2','L3','M1','M2'];
const JOURS = ['Samedi','Dimanche','Lundi','Mardi','Mercredi','Jeudi'];
const CRENEAUX = ['08:00-09:30','09:40-11:10','11:20-12:50','13:00-14:30','14:40-16:10','16:20-17:50'];

let toutesLesSessions = [];
const filtres = { niveau:'', filiere:'', groupe:'', jour:'', recherche:'' };

function parserCSV(texte, niveauDefaut){
  const lignes = texte.trim().split('\n').filter(l => l.trim());
  if (lignes.length < 2) return [];
  const header = lignes[0].split(',').map(s => s.trim());
  const hasFiliere = header.includes('Filière');
  const sessions = [];
  for (let i = 1; i < lignes.length; i++){
    const p = lignes[i].split(',');
    if (hasFiliere){
      if (p.length < 9) continue;
      sessions.push({
        niveau:(p[0]||niveauDefaut).trim(), filiere:p[1].trim(), groupe:p[2].trim(),
        jour:p[3].trim(), creneau:p[4].trim(), matiere:p[5].trim(),
        type:p[6].trim(), salle:p[7].trim(), enseignant:p[8].trim()
      });
    } else {
      if (p.length < 8) continue;
      sessions.push({
        niveau:(p[0]||niveauDefaut).trim(), filiere:'', groupe:p[1].trim(),
        jour:p[2].trim(), creneau:p[3].trim(), matiere:p[4].trim(),
        type:p[5].trim(), salle:p[6].trim(), enseignant:p[7].trim()
      });
    }
  }
  return sessions;
}

function chargerDonnees(){
  toutesLesSessions = [];
  NIVEAUX.forEach(niv => {
    const el = document.getElementById('csv-' + niv);
    if (el) toutesLesSessions = toutesLesSessions.concat(parserCSV(el.textContent, niv));
  });
  const vus = new Set();
  toutesLesSessions = toutesLesSessions.filter(s => {
    const k = [s.niveau,s.filiere,s.groupe,s.jour,s.creneau,s.matiere,s.type,s.salle,s.enseignant].join('|');
    if (vus.has(k)) return false;
    vus.add(k); return true;
  });
  console.log('✅ Séances chargées :', toutesLesSessions.length);
}

function sessionsFiltrees(){
  return toutesLesSessions.filter(s => {
    if (filtres.niveau && s.niveau !== filtres.niveau) return false;
    if (filtres.filiere && s.filiere !== filtres.filiere) return false;
    if (filtres.groupe && s.groupe !== filtres.groupe) return false;
    if (filtres.jour && s.jour !== filtres.jour) return false;
    if (filtres.recherche){
      const q = filtres.recherche.toLowerCase();
      const t = (s.matiere+' '+s.salle+' '+s.enseignant+' '+s.groupe).toLowerCase();
      if (!t.includes(q)) return false;
    }
    return true;
  });
}

function remplirSelects(){
  const setF = new Set(), setG = new Set();
  toutesLesSessions.forEach(s => {
    if (s.filiere) setF.add(s.filiere);
    if (s.groupe) setG.add(s.groupe);
  });
  const selF = document.getElementById('filterFiliere');
  const selG = document.getElementById('filterGroupe');
  selF.innerHTML = '<option value="">Toutes les filières</option>';
  selG.innerHTML = '<option value="">Tous les groupes</option>';
  [...setF].sort().forEach(f => selF.insertAdjacentHTML('beforeend', `<option>${f}</option>`));
  [...setG].sort().forEach(g => selG.insertAdjacentHTML('beforeend', `<option>${g}</option>`));
}

function rendreGrille(){
  const sessions = sessionsFiltrees();
  const body = document.getElementById('gridBody');
  body.innerHTML = '';
  CRENEAUX.forEach(creneau => {
    const ligne = document.createElement('div');
    ligne.className = 'gr';
    const heure = document.createElement('div');
    heure.className = 'gc tc';
    heure.textContent = creneau;
    ligne.appendChild(heure);
    JOURS.forEach(jour => {
      const cell = document.createElement('div');
      cell.className = 'gc';
      const liste = sessions.filter(s => s.jour === jour && s.creneau === creneau);
      if (liste.length === 0){
        const span = document.createElement('span');
        span.style.opacity = '0.2';
        span.textContent = '—';
        cell.appendChild(span);
      } else {
        liste.forEach(s => {
          const div = document.createElement('div');
          div.className = 'sess t-' + s.type;
          div.innerHTML = `
            <span class="tb">${s.type}</span>
            <span class="m">${s.matiere}</span>
            <span class="s">📍 ${s.salle}</span>
            <span class="e">👤 ${s.enseignant}</span>
            ${s.groupe ? `<span class="s">👥 ${s.niveau} - ${s.groupe}</span>` : ''}
          `;
          div.addEventListener('click', () => ouvrirModal(s));
          cell.appendChild(div);
        });
      }
      ligne.appendChild(cell);
    });
    body.appendChild(ligne);
  });
  majStats(sessions);
}

function rendreListe(){
  const sessions = sessionsFiltrees();
  const body = document.getElementById('listBody');
  body.innerHTML = '';
  if (sessions.length === 0){
    body.innerHTML = '<p style="color:var(--muted);padding:20px">Aucune séance trouvée.</p>';
    majStats([]); return;
  }
  const cont = document.createElement('div');
  cont.className = 'lv';
  sessions
    .sort((a,b) => JOURS.indexOf(a.jour)-JOURS.indexOf(b.jour) || a.creneau.localeCompare(b.creneau))
    .forEach(s => {
      const item = document.createElement('div');
      item.className = 'li';
      item.innerHTML = `
        <div class="jb">${s.niveau} • ${s.jour} ${s.filiere ? '• '+s.filiere : ''} ${s.groupe ? '• '+s.groupe : ''}</div>
        <div class="hh">🕐 ${s.creneau} • ${s.type}</div>
        <div class="mm">${s.matiere}</div>
        <div class="ss">📍 ${s.salle}</div>
        <div class="ee">👤 ${s.enseignant}</div>
      `;
      item.addEventListener('click', () => ouvrirModal(s));
      cont.appendChild(item);
    });
  body.appendChild(cont);
  majStats(sessions);
}

function majStats(sessions){
  document.getElementById('statTotal').textContent = toutesLesSessions.length;
  document.getElementById('statFiltered').textContent = sessions.length;
  document.getElementById('statMatieres').textContent = new Set(sessions.map(s=>s.matiere)).size;
  document.getElementById('statEnseignants').textContent = new Set(sessions.map(s=>s.enseignant)).size;
}

function ouvrirModal(s){
  document.getElementById('modalBody').innerHTML = `
    <h2>${s.matiere}</h2>
    <div class="row"><span class="l">Niveau</span><span class="v">${s.niveau}</span></div>
    ${s.filiere ? `<div class="row"><span class="l">Filière</span><span class="v">${s.filiere}</span></div>` : ''}
    ${s.groupe ? `<div class="row"><span class="l">Groupe</span><span class="v">${s.groupe}</span></div>` : ''}
    <div class="row"><span class="l">Jour</span><span class="v">${s.jour}</span></div>
    <div class="row"><span class="l">Créneau</span><span class="v">${s.creneau}</span></div>
    <div class="row"><span class="l">Type</span><span class="v">${s.type}</span></div>
    <div class="row"><span class="l">Salle</span><span class="v">${s.salle}</span></div>
    <div class="row"><span class="l">Enseignant</span><span class="v">${s.enseignant}</span></div>
  `;
  document.getElementById('modal').classList.remove('hidden');
}
function fermerModal(){ document.getElementById('modal').classList.add('hidden'); }

function rafraichir(){
  if (!document.getElementById('gridView').classList.contains('hidden')) rendreGrille();
  else rendreListe();
}

document.getElementById('filterNiveau').addEventListener('change', e => { filtres.niveau = e.target.value; rafraichir(); });
document.getElementById('filterFiliere').addEventListener('change', e => { filtres.filiere = e.target.value; rafraichir(); });
document.getElementById('filterGroupe').addEventListener('change', e => { filtres.groupe = e.target.value; rafraichir(); });
document.getElementById('filterJour').addEventListener('change', e => { filtres.jour = e.target.value; rafraichir(); });
document.getElementById('filterRecherche').addEventListener('input', e => { filtres.recherche = e.target.value; rafraichir(); });

document.getElementById('resetBtn').addEventListener('click', () => {
  Object.keys(filtres).forEach(k => filtres[k] = '');
  ['filterNiveau','filterFiliere','filterGroupe','filterJour','filterRecherche'].forEach(id => document.getElementById(id).value='');
  document.querySelectorAll('.qb').forEach(b => b.classList.toggle('active', b.dataset.quickLevel===''));
  rafraichir();
});

document.querySelectorAll('.qb').forEach(btn => {
  btn.addEventListener('click', () => {
    filtres.niveau = btn.dataset.quickLevel;
    document.getElementById('filterNiveau').value = filtres.niveau;
    document.querySelectorAll('.qb').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    rafraichir();
  });
});

document.getElementById('viewGrid').addEventListener('click', () => {
  document.getElementById('gridView').classList.remove('hidden');
  document.getElementById('listView').classList.add('hidden');
  document.getElementById('viewGrid').classList.add('active');
  document.getElementById('viewList').classList.remove('active');
  rendreGrille();
});
document.getElementById('viewList').addEventListener('click', () => {
  document.getElementById('listView').classList.remove('hidden');
  document.getElementById('gridView').classList.add('hidden');
  document.getElementById('viewList').classList.add('active');
  document.getElementById('viewGrid').classList.remove('active');
  rendreListe();
});

document.getElementById('modalClose').addEventListener('click', fermerModal);
document.getElementById('modal').addEventListener('click', e => { if (e.target.id === 'modal') fermerModal(); });

document.getElementById('themeToggle').addEventListener('click', () => {
  const html = document.documentElement;
  html.setAttribute('data-theme', html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
});
document.getElementById('printBtn').addEventListener('click', () => window.print());
document.getElementById('shareBtn').addEventListener('click', () => {
  const url = window.location.href;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(url).then(() => alert('🔗 Lien copié !'));
  } else {
    prompt('Copiez ce lien :', url);
  }
});

document.addEventListener('DOMContentLoaded', () => {
  chargerDonnees();
  remplirSelects();
  rendreGrille();
});
</script>

</body>
</html>
