<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>IGEE Social — Internal Network of IGEE Institute</title>
<meta name="theme-color" content="#1877f2">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cdefs%3E%3ClinearGradient id='b' x1='0%25' y1='0%25' x2='0%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%234A90E2'/%3E%3Cstop offset='50%25' stop-color='%231877F2'/%3E%3Cstop offset='100%25' stop-color='%230C5CBF'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='16' y='16' width='480' height='480' rx='110' fill='url(%23b)'/%3E%3Ctext x='256' y='295' font-family='Arial' font-size='170' font-weight='900' fill='white' text-anchor='middle' dominant-baseline='middle' letter-spacing='-8'%3EIGEE%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cdefs%3E%3ClinearGradient id='b' x1='0%25' y1='0%25' x2='0%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%234A90E2'/%3E%3Cstop offset='50%25' stop-color='%231877F2'/%3E%3Cstop offset='100%25' stop-color='%230C5CBF'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='16' y='16' width='480' height='480' rx='110' fill='url(%23b)'/%3E%3Ctext x='256' y='295' font-family='Arial' font-size='170' font-weight='900' fill='white' text-anchor='middle' dominant-baseline='middle' letter-spacing='-8'%3EIGEE%3C/text%3E%3C/svg%3E">
<style>
:root{--bg-main:#f0f2f5;--bg-card:#ffffff;--bg-input:#f0f2f5;--bg-hover:#e4e6eb;--bg-comments:#f0f2f5;--text-primary:#050505;--text-secondary:#65676b;--text-tertiary:#90949c;--border:#e4e6eb;--border-soft:#f0f2f5;--shadow:rgba(0,0,0,.1);}
[data-theme="dark"]{--bg-main:#18191a;--bg-card:#242526;--bg-input:#3a3b3c;--bg-hover:#3a3b3c;--bg-comments:#18191a;--text-primary:#e4e6eb;--text-secondary:#b0b3b8;--text-tertiary:#808080;--border:#3e4042;--border-soft:#3a3b3c;--shadow:rgba(0,0,0,.3);}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Helvetica,Arial,sans-serif;-webkit-tap-highlight-color:transparent;}
html{-webkit-text-size-adjust:100%;}
body{background:var(--bg-main);color:var(--text-primary);min-height:100vh;overflow-x:hidden;transition:background .3s,color .3s;}
a{text-decoration:none;color:inherit;}img{display:block;max-width:100%;}button{font-family:inherit;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes fadeInUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
@keyframes slideInRight{from{transform:translateX(100%);opacity:0;}to{transform:translateX(0);opacity:1;}}
@keyframes slideUp{from{transform:translateY(20px);opacity:0;}to{opacity:1;transform:translateY(0);}}
@keyframes popIn{from{transform:scale(.9);opacity:0;}to{transform:scale(1);opacity:1;}}
@keyframes bellShake{0%,100%{transform:rotate(0);}25%{transform:rotate(-15deg);}75%{transform:rotate(15deg);}}
@keyframes bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
@keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}
@keyframes gradient{0%{background-position:0% 50%;}50%{background-position:100% 50%;}100%{background-position:0% 50%;}}
@keyframes heartBeat{0%{transform:scale(1);}15%{transform:scale(1.3);}30%{transform:scale(1);}45%{transform:scale(1.15);}60%{transform:scale(1);}}
@keyframes shine{0%{background-position:-200% center;}100%{background-position:200% center;}}
@keyframes reactionPop{0%{transform:scale(0) rotate(-180deg);opacity:0;}60%{transform:scale(1.3) rotate(10deg);}100%{transform:scale(1) rotate(0);opacity:1;}}
@keyframes lightboxIn{from{opacity:0;transform:scale(.9);}to{opacity:1;transform:scale(1);}}
@keyframes logoFloat{0%,100%{transform:translateY(0) rotate(0);}50%{transform:translateY(-8px) rotate(-2deg);}}
@keyframes authGradientShift{0%{background-position:0% 50%;}50%{background-position:100% 50%;}100%{background-position:0% 50%;}}
@keyframes twinkleStars{0%,100%{opacity:0.35;}50%{opacity:0.95;}}
@keyframes floatStars{0%,100%{transform:translateY(0);}50%{transform:translateY(-14px);}}
@keyframes boxRise{0%{opacity:0;transform:translateY(90px) scale(.92);}70%{opacity:1;transform:translateY(-6px) scale(1.01);}100%{opacity:1;transform:translateY(0) scale(1);}}
@keyframes boxBreathe{0%,100%{box-shadow:0 10px 30px rgba(0,0,0,.2),0 0 0 0 rgba(24,119,242,.35);}50%{box-shadow:0 14px 40px rgba(0,0,0,.28),0 0 28px 6px rgba(24,119,242,.32);}}
@keyframes slideInLeft{from{opacity:0;transform:translateX(-45px);}to{opacity:1;transform:translateX(0);}}
@keyframes errorSlide{from{opacity:0;transform:translateX(35px);}to{opacity:1;transform:translateX(0);}}
@keyframes errorPulse{0%,100%{box-shadow:0 0 0 0 rgba(201,42,42,.35);}50%{box-shadow:0 0 0 8px rgba(201,42,42,0);}}
.loading-bar{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,#1877f2,#42b72a,#e91e63,#ff9800,#1877f2);background-size:300% 100%;animation:gradient 2s ease infinite;z-index:9999;width:0;transition:width .3s ease;}
.loading-bar.active{width:100%;}
.igee-logo-3d{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative;background:linear-gradient(180deg,#4A90E2 0%,#1877F2 50%,#0C5CBF 100%);box-shadow:0 4px 12px rgba(24,119,242,.4),inset 0 2px 4px rgba(255,255,255,.3),inset 0 -2px 4px rgba(0,0,0,.2);overflow:hidden;transition:transform .25s ease;}
.igee-logo-3d::before{content:'';position:absolute;top:0;left:0;right:0;height:50%;background:linear-gradient(180deg,rgba(255,255,255,.35) 0%,rgba(255,255,255,0) 100%);border-radius:14px 14px 50% 50%;pointer-events:none;}
.igee-logo-3d svg{width:100%;height:100%;position:relative;z-index:1;}
.igee-logo-3d:hover{transform:scale(1.08) rotate(-3deg);}
.book-logo-3d{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative;background:linear-gradient(180deg,#4A90E2 0%,#1877F2 50%,#0C5CBF 100%);box-shadow:0 4px 12px rgba(24,119,242,.4),inset 0 2px 4px rgba(255,255,255,.3),inset 0 -2px 4px rgba(0,0,0,.2);overflow:hidden;transition:transform .25s ease;}
.book-logo-3d::before{content:'';position:absolute;top:0;left:0;right:0;height:50%;background:linear-gradient(180deg,rgba(255,255,255,.35) 0%,rgba(255,255,255,0) 100%);border-radius:14px 14px 50% 50%;pointer-events:none;}
.book-logo-3d svg{width:100%;height:100%;position:relative;z-index:1;}
.book-logo-3d:hover{transform:scale(1.08) rotate(3deg);}
.auth-logos-row{display:flex;gap:22px;align-items:center;justify-content:center;margin-bottom:18px;position:relative;z-index:2;}
.auth-logo-3d{width:100px;height:100px;border-radius:22px;box-shadow:0 8px 24px rgba(24,119,242,.5),inset 0 3px 6px rgba(255,255,255,.35),inset 0 -3px 6px rgba(0,0,0,.25);animation:logoFloat 3s ease-in-out infinite;}
.auth-logo-3d::before{border-radius:22px 22px 50% 50%;}
.auth-logos-row .book-logo-3d.auth-logo-3d{animation-delay:.6s;}
.auth-page{min-height:100vh;background:linear-gradient(-45deg,#1877f2,#42b72a,#0c5cbf,#1b5e20,#1877f2);background-size:400% 400%;animation:authGradientShift 14s ease infinite;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;position:relative;overflow:hidden;}
.auth-page::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 20% 30%,rgba(255,255,255,.12) 0%,transparent 50%),radial-gradient(circle at 80% 70%,rgba(255,255,255,.15) 0%,transparent 50%);animation:float 6s ease-in-out infinite;pointer-events:none;z-index:0;}
.auth-page::after{content:'';position:absolute;inset:-10% 0 0 0;background-image:radial-gradient(2px 2px at 8% 18%,rgba(255,255,255,.95),transparent),radial-gradient(1.5px 1.5px at 22% 62%,rgba(255,255,255,.75),transparent),radial-gradient(2px 2px at 36% 12%,rgba(255,255,255,.9),transparent),radial-gradient(1.5px 1.5px at 48% 78%,rgba(255,255,255,.7),transparent),radial-gradient(2px 2px at 62% 32%,rgba(255,255,255,.85),transparent),radial-gradient(1.5px 1.5px at 74% 68%,rgba(255,255,255,.75),transparent),radial-gradient(2px 2px at 86% 22%,rgba(255,255,255,.9),transparent),radial-gradient(1.5px 1.5px at 12% 82%,rgba(255,255,255,.7),transparent),radial-gradient(2px 2px at 55% 52%,rgba(255,255,255,.95),transparent),radial-gradient(1.5px 1.5px at 92% 58%,rgba(255,255,255,.75),transparent),radial-gradient(1.5px 1.5px at 30% 38%,rgba(255,255,255,.7),transparent),radial-gradient(2px 2px at 68% 88%,rgba(255,255,255,.85),transparent);background-repeat:no-repeat;animation:twinkleStars 3.2s ease-in-out infinite alternate,floatStars 9s ease-in-out infinite;pointer-events:none;z-index:1;}
.auth-slogan{color:#fff;margin-top:4px;margin-bottom:25px;font-size:16px;opacity:.95;position:relative;z-index:2;text-align:center;}
.auth-box{background:#fff;padding:30px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.2);width:420px;max-width:100%;position:relative;z-index:2;animation:boxRise 0.95s cubic-bezier(.34,1.56,.64,1) both,boxBreathe 3.4s ease-in-out 1.4s infinite;}
.auth-box h2{text-align:center;margin-bottom:22px;color:#1877f2;font-size:24px;}
.auth-box input{width:100%;padding:14px 16px;margin-bottom:12px;border:1px solid #ddd;border-radius:8px;font-size:15px;outline:none;background:#f5f6f7;color:#050505;transition:border-color .25s ease,background .25s ease,box-shadow .25s ease;}
.auth-box input:focus{border-color:#1877f2;background:#fff;box-shadow:0 0 0 3px rgba(24,119,242,.15);}
.auth-box input[name="email"]{animation:slideInLeft .55s ease .45s both;}
.auth-box input[name="password"]{animation:slideInLeft .55s ease .62s both;}
.auth-box input[name="prenom"]{animation:slideInLeft .55s ease .40s both;}
.auth-box input[name="nom"]{animation:slideInLeft .55s ease .52s both;}
.auth-box form > input[name="email"]:nth-of-type(3){animation:slideInLeft .55s ease .64s both;}
.auth-box form > input[name="password"]:nth-of-type(4){animation:slideInLeft .55s ease .76s both;}
.auth-box button{width:100%;padding:14px;background:#1877f2;color:#fff;border:none;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer;position:relative;overflow:hidden;animation:fadeInUp .55s ease .88s both;transition:transform .25s ease,box-shadow .25s ease,background .25s ease;}
.auth-box button::before{content:'';position:absolute;top:0;left:-100%;width:60%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);transition:left .65s ease;pointer-events:none;}
.auth-box button:hover{background:#166fe5;transform:translateY(-3px);box-shadow:0 10px 24px rgba(24,119,242,.45),0 0 0 4px rgba(24,119,242,.15);}
.auth-box button:hover::before{left:130%;}
.auth-box button:disabled{background:#ccc;cursor:not-allowed;transform:none;box-shadow:none;}
.auth-box button:disabled::before{display:none;}
.auth-box .link{text-align:center;margin-top:16px;color:#65676b;font-size:14px;}
.auth-box .link a{color:#1877f2;font-weight:bold;position:relative;text-decoration:none;display:inline-block;}
.auth-box .link a::after{content:'';position:absolute;left:0;bottom:-2px;width:0;height:2px;background:#1877f2;transition:width .3s ease;border-radius:2px;}
.auth-box .link a:hover::after{width:100%;}
.error-msg{background:#ffebe8;color:#c92a2a;padding:10px;border-radius:6px;margin-bottom:12px;font-size:14px;text-align:center;animation:errorSlide .45s cubic-bezier(.34,1.56,.64,1) both,errorPulse 1.8s ease-in-out .45s infinite;border:1px solid rgba(201,42,42,.15);}
.navbar{background:var(--bg-card);height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;box-shadow:0 2px 4px var(--shadow);position:sticky;top:0;z-index:100;transition:background .3s;}
.navbar .logo{display:flex;align-items:center;gap:12px;text-decoration:none;}
.navbar .search{background:var(--bg-input);color:var(--text-primary);border-radius:20px;padding:9px 16px;border:none;width:280px;outline:none;font-size:14px;transition:.3s;}
.navbar .search:focus{background:var(--bg-hover);width:320px;}
.navbar .nav-icons{display:flex;gap:8px;align-items:center;}
.navbar .nav-icons a,.navbar .nav-icons button{width:42px;height:42px;border-radius:50%;background:var(--bg-input);color:var(--text-primary);display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;border:none;position:relative;transition:.25s;}
.navbar .nav-icons a:hover,.navbar .nav-icons button:hover{background:var(--bg-hover);transform:translateY(-3px);}
.navbar .badge{position:absolute;top:-2px;right:-2px;background:#e41e3f;color:#fff;font-size:11px;font-weight:bold;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 5px;}
.navbar .user-avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;cursor:pointer;border:2px solid #1877f2;}
.notif-wrapper{position:relative;}
.notif-bell{width:42px;height:42px;border-radius:50%;background:var(--bg-input);color:var(--text-primary);display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;border:none;position:relative;transition:.25s;}
.notif-bell:hover{background:var(--bg-hover);}
.notif-bell.has-new{animation:bellShake 1s ease infinite;}
.notif-panel{position:absolute;top:54px;right:0;width:380px;max-width:calc(100vw - 40px);max-height:520px;background:var(--bg-card);color:var(--text-primary);border-radius:12px;box-shadow:0 12px 40px var(--shadow);overflow:hidden;display:none;z-index:200;}
.notif-panel.active{display:block;}
.notif-header{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.notif-header h3{font-size:20px;}
.notif-header .mark-all{color:#1877f2;font-size:13px;cursor:pointer;font-weight:500;background:none;border:none;padding:4px 8px;border-radius:4px;}
.notif-list{max-height:440px;overflow-y:auto;padding:6px 0;}
.notif-item{display:flex;gap:12px;padding:10px 16px;cursor:pointer;position:relative;align-items:flex-start;}
.notif-item:hover{background:var(--bg-hover);}
.notif-item.unread{background:rgba(24,119,242,.15);}
.notif-item .notif-avatar{width:52px;height:52px;border-radius:50%;object-fit:cover;flex-shrink:0;}
.notif-item .notif-avatar-wrap{position:relative;flex-shrink:0;}
.notif-item .notif-icon{position:absolute;bottom:-2px;right:-2px;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;border:2px solid var(--bg-card);background:#1877f2;}
.notif-item .notif-icon.like{background:linear-gradient(135deg,#1877f2,#42b72a);}
.notif-item .notif-icon.comment{background:#42b72a;}
.notif-item .notif-icon.message{background:#e91e63;}
.notif-item .notif-icon.event{background:#ff9800;}
.notif-item .notif-icon.group{background:#9c27b0;}
.notif-item .notif-content{flex:1;}
.notif-item .notif-text{font-size:14px;line-height:1.4;}
.notif-item .notif-text .bold{font-weight:bold;}
.notif-item .notif-time{font-size:12px;color:var(--text-secondary);margin-top:3px;}
.notif-item .notif-dot{position:absolute;right:16px;top:50%;transform:translateY(-50%);width:10px;height:10px;border-radius:50%;background:#1877f2;}
.notif-empty{padding:40px 20px;text-align:center;color:var(--text-secondary);}
.notif-empty .emoji{font-size:48px;margin-bottom:12px;display:inline-block;}
.notif-delete{position:absolute;right:12px;top:12px;width:24px;height:24px;border-radius:50%;background:transparent;border:none;cursor:pointer;color:var(--text-tertiary);font-size:14px;opacity:0;display:flex;align-items:center;justify-content:center;}
.notif-item:hover .notif-delete{opacity:1;}
.notif-delete:hover{background:#ffebe8;color:#d93025;}
.chat-sidebar{position:fixed;top:60px;right:0;width:328px;height:calc(100vh - 60px);background:var(--bg-card);box-shadow:-2px 0 12px var(--shadow);z-index:150;display:none;flex-direction:column;}
.chat-sidebar.active{display:flex;}
.chat-sidebar-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.chat-sidebar-header h3{font-size:22px;font-weight:bold;}
.chat-sidebar-header .close-sidebar{background:none;border:none;cursor:pointer;font-size:20px;color:var(--text-secondary);width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
.chat-sidebar-search{padding:10px 16px;}
.chat-sidebar-search input{width:100%;padding:9px 16px;border:none;outline:none;background:var(--bg-input);color:var(--text-primary);border-radius:20px;font-size:14px;}
.chat-conversations{flex:1;overflow-y:auto;}
.chat-conv-item{display:flex;gap:12px;padding:10px 16px;cursor:pointer;align-items:center;border-radius:8px;margin:2px 8px;}
.chat-conv-item:hover{background:var(--bg-hover);}
.chat-conv-item img{width:56px;height:56px;border-radius:50%;object-fit:cover;}
.chat-conv-item .info{flex:1;min-width:0;}
.chat-conv-item .info .name{font-weight:600;font-size:15px;}
.chat-conv-item .info .last{font-size:13px;color:var(--text-secondary);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.chat-conv-item.unread .info .last{font-weight:bold;color:var(--text-primary);}
.chat-conv-item .dot{width:12px;height:12px;border-radius:50%;background:#1877f2;}
.chat-empty{padding:40px 20px;text-align:center;color:var(--text-secondary);}
.chat-empty .emoji{font-size:48px;margin-bottom:12px;}
#chat-windows-container{position:fixed;bottom:0;right:20px;display:flex;align-items:flex-end;gap:12px;z-index:1000;pointer-events:none;}
.chat-window{width:328px;height:455px;background:var(--bg-card);border-radius:10px 10px 0 0;box-shadow:0 4px 20px var(--shadow);display:flex;flex-direction:column;pointer-events:auto;overflow:hidden;}
.chat-window.minimized{height:50px;}
.chat-window-header{padding:10px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;cursor:pointer;min-height:50px;}
.chat-window-header:hover{background:var(--bg-hover);}
.chat-window-header img{width:32px;height:32px;border-radius:50%;object-fit:cover;}
.chat-window-header .name{flex:1;font-weight:bold;font-size:15px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.chat-window-header .ctrl-btn{width:28px;height:28px;border-radius:50%;background:transparent;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text-secondary);}
.chat-window-header .ctrl-btn:hover{background:var(--bg-hover);}
.chat-window-body{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:2px;}
.chat-window.minimized .chat-window-body,.chat-window.minimized .chat-window-input,.chat-window.minimized .chat-reply-preview{display:none;}
.chat-msg{max-width:75%;padding:8px 12px;border-radius:18px;font-size:14px;line-height:1.4;word-wrap:break-word;position:relative;}
.chat-msg.sent{background:#1877f2;color:#fff;align-self:flex-end;border-bottom-right-radius:4px;}
.chat-msg.received{background:var(--bg-input);color:var(--text-primary);align-self:flex-start;border-bottom-left-radius:4px;}
.chat-msg .time{font-size:10px;opacity:.7;margin-top:4px;display:block;}
.chat-window-input{padding:8px 12px;border-top:1px solid var(--border);display:flex;gap:8px;align-items:center;}
.chat-window-input input{flex:1;padding:8px 14px;border-radius:20px;border:none;outline:none;background:var(--bg-input);color:var(--text-primary);font-size:14px;}
.chat-window-input button{background:transparent;border:none;cursor:pointer;font-size:20px;color:#1877f2;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
.chat-msg-wrapper{position:relative;display:flex;flex-direction:column;max-width:78%;align-self:flex-start;margin-bottom:8px;}
.chat-msg-wrapper.sent{align-self:flex-end;}
.chat-msg-wrapper .chat-msg{max-width:100%;}
.chat-msg-actions{display:flex;gap:4px;margin-top:2px;opacity:0;pointer-events:none;transition:opacity .15s ease;}
.chat-msg-wrapper:hover .chat-msg-actions,.chat-msg-wrapper.show-actions .chat-msg-actions{opacity:1;pointer-events:auto;}
.chat-msg-wrapper.sent .chat-msg-actions{justify-content:flex-end;}
.chat-msg-action-btn{background:var(--bg-card);border:1px solid var(--border);width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;padding:0;transition:.2s;color:var(--text-secondary);}
.chat-msg-action-btn:hover{background:var(--bg-hover);transform:scale(1.1);color:var(--text-primary);}
.chat-msg-reactions{display:flex;gap:2px;margin-top:-8px;margin-left:10px;align-self:flex-start;z-index:2;}
.chat-msg-reactions.sent{align-self:flex-end;margin-right:10px;margin-left:0;}
.chat-reaction-badge{background:var(--bg-card);border:1.5px solid var(--bg-card);border-radius:12px;padding:2px 6px;font-size:12px;box-shadow:0 1px 4px rgba(0,0,0,.18);line-height:1;display:flex;align-items:center;gap:2px;font-weight:600;cursor:pointer;animation:popIn .2s ease;}
.chat-reaction-badge .count{font-size:10px;color:var(--text-secondary);}
.chat-reaction-picker{position:fixed;background:var(--bg-card);border-radius:30px;box-shadow:0 8px 30px rgba(0,0,0,.28);padding:6px 8px;display:flex;gap:2px;z-index:10000;animation:popIn .18s ease;border:1px solid var(--border);}
.chat-reaction-picker button{width:40px;height:40px;border:none;background:transparent;font-size:24px;cursor:pointer;border-radius:50%;transition:transform .2s;display:flex;align-items:center;justify-content:center;padding:0;}
.chat-reaction-picker button:hover{transform:scale(1.35) translateY(-4px);}
.chat-reply-quote{background:rgba(24,119,242,.15);border-left:3px solid #1877f2;padding:5px 8px;border-radius:6px;font-size:12px;margin-bottom:5px;color:var(--text-secondary);line-height:1.35;white-space:normal;word-break:break-word;}
.chat-msg.sent .chat-reply-quote{background:rgba(255,255,255,.2);border-left-color:rgba(255,255,255,.85);color:rgba(255,255,255,.9);}
.chat-reply-quote strong{color:var(--text-primary);font-size:11px;display:block;margin-bottom:1px;}
.chat-msg.sent .chat-reply-quote strong{color:#fff;}
.chat-reply-preview{display:flex;gap:8px;padding:8px 12px;background:var(--bg-card);border-top:1px solid var(--border);align-items:center;animation:slideUp .2s ease;}
.crp-bar{width:3px;height:32px;background:#1877f2;border-radius:3px;flex-shrink:0;}
.crp-content{flex:1;min-width:0;}
.crp-content strong{font-size:12px;color:#1877f2;display:block;}
.crp-text{font-size:13px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
.crp-close{background:none;border:none;cursor:pointer;color:var(--text-tertiary);font-size:16px;padding:4px 8px;border-radius:50%;}
.crp-close:hover{background:var(--bg-hover);}
.chat-fab{position:fixed;bottom:20px;right:20px;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#1877f2,#42b72a);color:#fff;border:none;cursor:pointer;font-size:24px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(24,119,242,.4);z-index:999;}
.chat-fab:hover{transform:scale(1.1);}
.chat-fab .badge{position:absolute;top:-2px;right:-2px;background:#e41e3f;color:#fff;font-size:11px;font-weight:bold;min-width:20px;height:20px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 5px;border:2px solid var(--bg-card);}
.container{display:grid;grid-template-columns:280px 1fr 280px;gap:20px;max-width:1400px;margin:20px auto;padding:0 15px;}
.sidebar{position:sticky;top:80px;height:fit-content;}
.sidebar h3{margin-bottom:10px;color:var(--text-secondary);font-size:14px;text-transform:uppercase;letter-spacing:.5px;}
.menu-item{display:flex;align-items:center;gap:12px;padding:10px;border-radius:8px;color:var(--text-primary);font-weight:500;margin-bottom:4px;cursor:pointer;font-size:15px;transition:.2s;}
.menu-item:hover{background:var(--bg-hover);transform:translateX(4px);}
.menu-item.active{background:rgba(24,119,242,.15);color:#1877f2;font-weight:bold;}
.menu-item .icon{font-size:22px;width:28px;text-align:center;}
.menu-item img{width:36px;height:36px;border-radius:50%;object-fit:cover;}
.menu-item.clubs-item{background:linear-gradient(135deg,rgba(255,152,0,.15),rgba(255,87,34,.15));border-left:3px solid #ff9800;}
.menu-item.clubs-item:hover{background:linear-gradient(135deg,rgba(255,152,0,.25),rgba(255,87,34,.25));transform:translateX(6px);}
.menu-item.clubs-item.active{background:linear-gradient(135deg,#ff9800,#f57c00);color:#fff;border-left-color:#e65100;}
.menu-item.saved-item{border-left:3px solid #e91e63;}
.menu-item.saved-item.active{background:rgba(233,30,99,.15);color:#e91e63;}
.create-post{background:var(--bg-card);border-radius:10px;padding:15px;box-shadow:0 1px 2px var(--shadow);margin-bottom:20px;transition:background .3s;}
.create-post textarea{width:100%;border:none;outline:none;resize:none;font-size:16px;min-height:60px;padding:12px;background:var(--bg-input);color:var(--text-primary);border-radius:20px;}
.create-post .actions{display:flex;gap:10px;align-items:center;justify-content:space-between;}
.create-post .actions .left{display:flex;gap:8px;align-items:center;}
.create-post label.file-btn{cursor:pointer;color:#1877f2;font-size:20px;padding:8px 12px;border-radius:8px;}
.create-post label.file-btn:hover{background:rgba(24,119,242,.1);}
.create-post .file-name{font-size:13px;color:var(--text-secondary);}
.create-post button[type=submit]{background:#1877f2;color:#fff;border:none;padding:10px 26px;border-radius:8px;font-weight:bold;cursor:pointer;font-size:15px;}
.create-post button[type=submit]:disabled{background:#ccc;cursor:not-allowed;}
.post{background:var(--bg-card);border-radius:10px;margin-bottom:20px;box-shadow:0 1px 2px var(--shadow);overflow:hidden;position:relative;transition:.3s;}
.post:hover{box-shadow:0 6px 24px var(--shadow);}
.post-header{display:flex;align-items:center;padding:12px 15px;gap:10px;}
.post-header img{width:42px;height:42px;border-radius:50%;object-fit:cover;cursor:pointer;}
.post-header .name{font-weight:bold;font-size:15px;}
.post-header .date{font-size:12px;color:var(--text-secondary);margin-top:2px;}
.post-content{padding:0 15px 12px;font-size:15px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word;}
.post-content img{width:100%;border-radius:8px;margin-top:10px;max-height:520px;object-fit:cover;cursor:pointer;transition:.2s;}
.post-content img:hover{opacity:.95;}
.post-content a{color:#1877f2;text-decoration:underline;word-break:break-all;font-weight:500;}
.post-menu-btn{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;border:none;background:transparent;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;color:var(--text-secondary);opacity:.6;}
.post:hover .post-menu-btn{opacity:1;}
.post-menu-btn:hover{background:var(--bg-hover);}
.post-dropdown{position:absolute;top:52px;right:12px;background:var(--bg-card);border-radius:8px;box-shadow:0 4px 20px var(--shadow);min-width:240px;z-index:50;display:none;overflow:hidden;}
.post-dropdown.active{display:block;}
.post-dropdown .dropdown-item{padding:11px 16px;cursor:pointer;font-size:14px;display:flex;align-items:center;gap:10px;color:var(--text-primary);}
.post-dropdown .dropdown-item:hover{background:var(--bg-hover);padding-left:20px;}
.post-dropdown .dropdown-item.danger{color:#d93025;}
.post-dropdown .dropdown-item.saved{color:#e91e63;}
.post-dropdown .dropdown-item .dd-icon{font-size:16px;width:20px;text-align:center;}
.youtube-preview{margin-top:10px;border-radius:10px;overflow:hidden;background:#000;}
.youtube-preview iframe{display:block;width:100%;aspect-ratio:16/9;border:none;}
.link-preview{margin-top:10px;border:1px solid var(--border);border-radius:10px;overflow:hidden;display:block;}
.link-preview:hover{background:var(--bg-hover);}
.link-preview .lp-header{padding:10px 14px;background:var(--bg-hover);border-bottom:1px solid var(--border);}
.link-preview .lp-domain{font-size:11px;text-transform:uppercase;color:var(--text-secondary);}
.link-preview .lp-title{font-weight:bold;color:#1877f2;font-size:14px;margin-top:2px;word-break:break-all;}
.post-stats{display:flex;justify-content:space-between;padding:8px 15px;font-size:13px;color:var(--text-secondary);border-top:1px solid var(--border);}
.post-stats .stat-likes{display:flex;align-items:center;gap:6px;}
.post-stats .reactions-display{display:flex;}
.post-stats .reactions-display span{width:22px;height:22px;border-radius:50%;background:var(--bg-card);display:flex;align-items:center;justify-content:center;font-size:12px;margin-left:-4px;border:2px solid var(--bg-card);animation:reactionPop .3s ease;}
.post-stats .reactions-display span:first-child{margin-left:0;}
.post-stats .emoji-badge{display:inline-flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1877f2,#42b72a);color:#fff;width:20px;height:20px;border-radius:50%;font-size:11px;}
.post-actions{display:flex;border-top:1px solid var(--border);padding:4px 8px;position:relative;}
.post-actions button{flex:1;text-align:center;padding:9px;background:none;border:none;cursor:pointer;color:var(--text-secondary);font-weight:600;font-size:14px;border-radius:6px;display:flex;align-items:center;justify-content:center;gap:6px;transition:.2s;}
.post-actions button:hover{background:var(--bg-hover);color:#1877f2;}
.post-actions button.liked{color:#1877f2;}
.post-actions button.liked .like-icon{animation:heartBeat .8s ease;}
.reaction-picker{position:absolute;bottom:100%;left:8px;background:var(--bg-card);border-radius:30px;box-shadow:0 6px 24px var(--shadow);padding:6px 10px;display:flex;gap:4px;opacity:0;pointer-events:none;visibility:hidden;transform:translateY(10px) scale(.8);transition:.25s cubic-bezier(.68,-.55,.27,1.55);z-index:60;}
.reaction-picker.active{opacity:1;pointer-events:auto;visibility:visible;transform:translateY(-8px) scale(1);}
.reaction-picker .reaction-btn{width:44px;height:44px;border-radius:50%;border:none;cursor:pointer;font-size:24px;background:transparent;transition:.2s;display:flex;align-items:center;justify-content:center;transform:scale(1);}
.reaction-picker .reaction-btn:hover{transform:scale(1.4) translateY(-6px);}
.comments{padding:10px 15px 14px;background:var(--bg-comments);}
.comment{display:flex;gap:8px;margin-bottom:10px;align-items:flex-start;position:relative;}
.comment img{width:34px;height:34px;border-radius:50%;object-fit:cover;flex-shrink:0;cursor:pointer;}
.comment .bubble{background:var(--bg-card);padding:8px 14px;border-radius:18px;font-size:14px;max-width:100%;word-wrap:break-word;}
.comment .bubble .name{font-weight:bold;display:block;font-size:13px;margin-bottom:2px;}
.comment .bubble .time{font-size:11px;color:var(--text-tertiary);margin-left:6px;}
.comment-del-btn{background:transparent;border:none;cursor:pointer;color:var(--text-tertiary);font-size:12px;padding:2px 6px;margin-left:6px;border-radius:4px;opacity:0;}
.comment:hover .comment-del-btn{opacity:1;}
.comment-del-btn:hover{background:#ffebe8;color:#d93025;}
.comment-form{display:flex;gap:8px;margin-top:8px;}
.comment-form input{flex:1;padding:9px 16px;border-radius:20px;border:none;outline:none;background:var(--bg-card);color:var(--text-primary);font-size:14px;}
.empty-state{background:var(--bg-card);border-radius:10px;padding:40px 20px;text-align:center;color:var(--text-secondary);box-shadow:0 1px 2px var(--shadow);}
.empty-state .emoji{font-size:48px;margin-bottom:12px;display:inline-block;}
.loading{text-align:center;padding:30px;color:var(--text-secondary);}
.lightbox-overlay{position:fixed;inset:0;background:rgba(0,0,0,.95);display:none;align-items:center;justify-content:center;z-index:99999;padding:20px;animation:fadeIn .25s ease;}
.lightbox-overlay.active{display:flex;}
.lightbox-img{max-width:90vw;max-height:85vh;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:lightboxIn .3s ease;object-fit:contain;}
.lightbox-close{position:absolute;top:20px;right:30px;width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;border:none;cursor:pointer;font-size:24px;display:flex;align-items:center;justify-content:center;transition:.2s;}
.lightbox-close:hover{background:rgba(255,255,255,.3);transform:rotate(90deg);}
.lightbox-nav{position:absolute;top:50%;transform:translateY(-50%);width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;border:none;cursor:pointer;font-size:26px;display:flex;align-items:center;justify-content:center;transition:.2s;}
.lightbox-nav:hover{background:rgba(255,255,255,.3);}
.lightbox-nav.prev{left:30px;}
.lightbox-nav.next{right:30px;}
.lightbox-counter{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);color:#fff;font-size:14px;background:rgba(255,255,255,.15);padding:8px 18px;border-radius:20px;backdrop-filter:blur(10px);}
.hover-card{position:fixed;background:var(--bg-card);border-radius:12px;box-shadow:0 12px 40px var(--shadow);padding:20px;width:320px;z-index:10000;opacity:0;pointer-events:none;visibility:hidden;transform:translateY(10px) scale(.95);transition:all .25s ease;}
.hover-card.active{opacity:1;pointer-events:auto;visibility:visible;transform:translateY(0) scale(1);}
.hover-card .hc-cover{height:60px;background:linear-gradient(135deg,#1877f2,#42b72a);margin:-20px -20px 0 -20px;border-radius:12px 12px 0 0;}
.hover-card .hc-avatar{width:80px;height:80px;border-radius:50%;border:4px solid var(--bg-card);object-fit:cover;margin-top:-45px;}
.hover-card h4{margin-top:8px;font-size:18px;}
.hover-card .hc-bio{color:var(--text-secondary);font-size:13px;margin-top:6px;line-height:1.4;max-height:60px;overflow:hidden;}
.hover-card .hc-email{color:var(--text-tertiary);font-size:12px;margin-top:8px;}
.hover-card .hc-btn{display:block;margin-top:14px;background:#1877f2;color:#fff;text-align:center;padding:10px;border-radius:8px;font-weight:bold;font-size:14px;cursor:pointer;border:none;width:100%;}
.hover-card .hc-btn:hover{background:#166fe5;}
.hover-card .hc-btn.msg{background:#42b72a;margin-top:8px;}
.hover-card .hc-stats{display:flex;gap:12px;margin-top:12px;padding-top:12px;border-top:1px solid var(--border);}
.hover-card .hc-stats div{flex:1;text-align:center;}
.hover-card .hc-stats .num{font-weight:bold;font-size:15px;}
.hover-card .hc-stats .lbl{color:var(--text-tertiary);font-size:11px;text-transform:uppercase;}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px;}
.modal-overlay.active{display:flex;}
.modal{background:var(--bg-card);color:var(--text-primary);border-radius:12px;padding:24px;width:380px;max-width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:popIn .25s ease;}
.modal h3{margin-bottom:10px;font-size:18px;}
.modal p{color:var(--text-secondary);margin-bottom:20px;font-size:14px;line-height:1.5;}
.modal-btns{display:flex;gap:10px;}
.modal-btns button{flex:1;padding:11px;border:none;border-radius:8px;cursor:pointer;font-weight:bold;font-size:14px;}
.modal-btns .btn-cancel{background:var(--bg-hover);color:var(--text-primary);}
.modal-btns .btn-danger{background:#d93025;color:#fff;}
.activity-container{max-width:900px;margin:20px auto;padding:0 15px;}
.activity-header{background:var(--bg-card);border-radius:12px;padding:24px 30px;box-shadow:0 1px 3px var(--shadow);margin-bottom:20px;display:flex;align-items:center;gap:20px;}
.activity-header .icon-big{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#1877f2,#42b72a);display:flex;align-items:center;justify-content:center;font-size:32px;color:#fff;flex-shrink:0;}
.activity-header h1{font-size:28px;margin-bottom:4px;}
.activity-header p{color:var(--text-secondary);font-size:14px;}
.activity-tabs{background:var(--bg-card);border-radius:12px;padding:8px;box-shadow:0 1px 3px var(--shadow);margin-bottom:20px;display:flex;gap:4px;overflow-x:auto;}
.activity-tab{padding:10px 18px;border-radius:8px;cursor:pointer;font-weight:500;font-size:14px;color:var(--text-secondary);border:none;background:transparent;white-space:nowrap;display:flex;align-items:center;gap:8px;}
.activity-tab:hover{background:var(--bg-hover);}
.activity-tab.active{background:linear-gradient(135deg,#1877f2,#166fe5);color:#fff;}
.activity-tab .tab-count{background:rgba(0,0,0,.1);color:inherit;font-size:11px;padding:2px 8px;border-radius:10px;font-weight:bold;}
.activity-tab.active .tab-count{background:rgba(255,255,255,.25);}
.activity-list{display:flex;flex-direction:column;gap:12px;}
.activity-item{background:var(--bg-card);border-radius:12px;padding:16px 20px;box-shadow:0 1px 2px var(--shadow);display:flex;gap:16px;align-items:flex-start;}
.activity-item .act-icon-wrap{position:relative;flex-shrink:0;}
.activity-item .act-avatar{width:56px;height:56px;border-radius:50%;object-fit:cover;}
.activity-item .act-badge{position:absolute;bottom:-2px;right:-2px;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;border:2px solid var(--bg-card);background:#1877f2;}
.activity-item .act-body{flex:1;}
.activity-item .act-title{font-size:15px;font-weight:600;margin-bottom:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.activity-item .act-title .type-label{background:rgba(24,119,242,.15);color:#1877f2;font-size:11px;font-weight:bold;padding:2px 8px;border-radius:10px;text-transform:uppercase;}
.activity-item .act-content{font-size:14px;line-height:1.5;margin-bottom:8px;white-space:pre-wrap;max-height:120px;overflow:hidden;}
.activity-item .act-content img{max-width:100%;border-radius:8px;margin-top:8px;max-height:200px;object-fit:cover;}
.activity-item .act-meta{font-size:12px;color:var(--text-secondary);display:flex;gap:14px;flex-wrap:wrap;}
.activity-item .act-actions{display:flex;gap:8px;margin-top:10px;}
.activity-item .act-action-btn{padding:6px 12px;border-radius:6px;border:none;cursor:pointer;font-size:12px;font-weight:500;background:var(--bg-hover);color:var(--text-primary);display:flex;align-items:center;gap:4px;}
.activity-item .act-action-btn.danger{color:#d93025;}
.activity-empty{background:var(--bg-card);border-radius:12px;padding:60px 30px;text-align:center;color:var(--text-secondary);box-shadow:0 1px 3px var(--shadow);}
.activity-empty .emoji{font-size:64px;margin-bottom:16px;display:inline-block;}
.page-header-card{background:var(--bg-card);border-radius:12px;padding:24px 30px;box-shadow:0 1px 3px var(--shadow);margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;}
.page-header-card .title-wrap{display:flex;align-items:center;gap:20px;}
.page-header-card .icon-big{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#ff9800,#f57c00);display:flex;align-items:center;justify-content:center;font-size:32px;color:#fff;flex-shrink:0;}
.page-header-card h1{font-size:28px;margin-bottom:4px;}
.page-header-card p{color:var(--text-secondary);font-size:14px;}
.page-header-card .btn-create{background:linear-gradient(135deg,#ff9800,#f57c00);color:#fff;border:none;padding:12px 24px;border-radius:8px;font-weight:bold;cursor:pointer;display:flex;align-items:center;gap:8px;font-size:14px;}
.events-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;}
.event-card{background:var(--bg-card);border-radius:12px;overflow:hidden;box-shadow:0 1px 3px var(--shadow);cursor:pointer;transition:.25s;}
.event-card:hover{transform:translateY(-4px);box-shadow:0 8px 24px var(--shadow);}
.event-card .ev-cover{height:160px;background:linear-gradient(135deg,#ff9800,#f57c00);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;}
.event-card .ev-cover img{width:100%;height:100%;object-fit:cover;}
.event-card .ev-cover .ev-emoji{font-size:72px;}
.event-card .ev-date-badge{position:absolute;top:12px;left:12px;background:var(--bg-card);border-radius:10px;padding:8px 12px;text-align:center;box-shadow:0 4px 12px var(--shadow);}
.event-card .ev-date-badge .day{font-size:22px;font-weight:bold;color:#ff9800;line-height:1;}
.event-card .ev-date-badge .mon{font-size:11px;text-transform:uppercase;color:var(--text-secondary);margin-top:2px;}
.event-card .ev-body{padding:16px;}
.event-card .ev-title{font-size:17px;font-weight:bold;margin-bottom:6px;line-height:1.3;}
.event-card .ev-desc{font-size:13px;color:var(--text-secondary);margin-bottom:10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.event-card .ev-meta{font-size:12px;color:var(--text-secondary);display:flex;flex-direction:column;gap:4px;}
.event-card .ev-attendees{display:flex;align-items:center;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--border);}
.event-card .ev-attendees .avatars{display:flex;}
.event-card .ev-attendees .avatars img{width:28px;height:28px;border-radius:50%;border:2px solid var(--bg-card);margin-left:-8px;}
.event-card .ev-attendees .avatars img:first-child{margin-left:0;}
.event-card .ev-attendees .count{font-size:13px;color:var(--text-secondary);font-weight:500;}
.event-detail-cover{height:280px;border-radius:12px 12px 0 0;background:linear-gradient(135deg,#ff9800,#f57c00);position:relative;overflow:hidden;}
.event-detail-card{background:var(--bg-card);border-radius:0 0 12px 12px;padding:24px 30px 30px;box-shadow:0 1px 3px var(--shadow);margin-bottom:20px;}
.event-detail-card h1{font-size:30px;margin-bottom:16px;}
.event-detail-card .ev-info-row{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--border-soft);}
.event-detail-card .ev-info-row:last-child{border-bottom:none;}

function normalizeDOB(dob) {
    if (!dob) return '';
    
    // 1. Nettoyer l'heure éventuelle
    let cleanInput = String(dob).trim().split(/[\sT]/)[0];
    
    // 2. Format avec séparateurs (/, -, .)
    const parts = cleanInput.split(/[\/\-\.]/).filter(Boolean);
    if (parts.length === 3) {
        let year, month, day;
        // Si l'année est au début (ex: 1979/04/24)
        if (parts[0].length === 4) {
            year = parts[0]; 
            month = parseInt(parts[1]); 
            day = parseInt(parts[2]);
            // AJOUT DE SÉCURITÉ : Si le mois est > 12, on l'inverse avec le jour
            if (month > 12 && day <= 12) { let temp = month; month = day; day = temp; }
        } 
        // Si l'année est à la fin (ex: 24/04/1979)
        else if (parts[2].length === 4) {
            year = parts[2];
            let p1 = parseInt(parts[0]); let p2 = parseInt(parts[1]);
            if (p1 > 12) { day = p1; month = p2; }
            else if (p2 > 12) { month = p1; day = p2; }
            else { day = p1; month = p2; }
        } 
        // Si l'année sur 2 chiffres (ex: 24/04/79)
        else {
            year = parseInt(parts[2]) > 30 ? '19' + parts[2] : '20' + parts[2];
            day = parseInt(parts[0]); 
            month = parseInt(parts[1]);
            // AJOUT DE SÉCURITÉ
            if (month > 12 && day <= 12) { let temp = month; month = day; day = temp; }
        }
        return `${year}${String(month).padStart(2, '0')}${String(day).padStart(2, '0')}`;
    }

    // 3. Format 8 chiffres collés
    let str = cleanInput.replace(/\D/g, '');
    if (str.length === 8) {
        const isValidDate = (y, m, d) => {
            y = parseInt(y); m = parseInt(m); d = parseInt(d);
            return y >= 1950 && y <= 2030 && m >= 1 && m <= 12 && d >= 1 && d <= 31;
        };
        const yyyy1 = str.substring(0, 4); const mm1 = str.substring(4, 6); const dd1 = str.substring(6, 8);
        const dd2 = str.substring(0, 2); const mm2 = str.substring(2, 4); const yyyy2 = str.substring(4, 8);
        
        if (isValidDate(yyyy1, mm1, dd1)) return str;
        
        const asDDMM = isValidDate(yyyy2, mm2, dd2);
        const asMMDD = isValidDate(yyyy2, dd2, mm2);
        
        if (asDDMM && parseInt(dd2) > 12) return yyyy2 + mm2 + dd2;
        if (asMMDD && parseInt(mm2) > 12) return yyyy2 + dd2 + mm2;
        if (asDDMM && !asMMDD) return yyyy2 + mm2 + dd2;
        if (asMMDD && !asDDMM) return yyyy2 + dd2 + mm2;
        if (asDDMM && asMMDD) return yyyy2 + mm2 + dd2;
    }
    return str;
}

async function uploadToCloudinary(file, folder = 'igee_books') {
    const isPdf = file.type === 'application/pdf';
    const resourceType = isPdf ? 'raw' : 'image';
    const url = `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/${resourceType}/upload`;
    const formData = new FormData();
    formData.append('file', file);
    formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
    if (folder) formData.append('folder', folder);
    const res = await fetch(url, { method: 'POST', body: formData });
    if (!res.ok) {
        let errMsg = 'Upload failed';
        try { const errJson = await res.json(); errMsg = errJson.error?.message || errMsg; } catch(e) {}
        throw new Error(errMsg);
    }
    return await res.json();
}

function openFormModal(title, fieldsHTML, onReady) {

        form.innerHTML = fieldsHTML;
        overlay.classList.add('active');

        const close = (data) => {
            overlay.classList.remove('active');
            overlay.removeEventListener('click', overlayClickHandler);
            resolve(data);
        };

        const overlayClickHandler = (e) => { if (e.target === overlay) close(null); };
        overlay.addEventListener('click', overlayClickHandler);

        const cancelBtn = form.querySelector('.btn-cancel');
        if (cancelBtn) {
            cancelBtn.onclick = (e) => { e.preventDefault(); close(null); };
        }

        if (typeof onReady === 'function') {
            setTimeout(() => { try { onReady(); } catch(e) { console.error('onReady error:', e); } }, 20);
        }

        form.onsubmit = (e) => { e.preventDefault(); const fd = new FormData(form); const data = {}; for (const [k,v] of fd.entries()) data[k]=v; close(data); };
    });
}

        container.appendChild(win);
        this.openWindows[convId] = { convId, otherId, otherUser, minimized:false };
        win.querySelector('.minimize-btn').addEventListener('click', (e) => { e.stopPropagation(); this.minimize(convId); });
        win.querySelector('.close-btn').addEventListener('click', (e) => { e.stopPropagation(); this.close(convId); });
        win.querySelector('.chat-window-header').addEventListener('click', () => { if (this.openWindows[convId]?.minimized) { win.classList.remove('minimized'); this.openWindows[convId].minimized = false; } });
        const input = win.querySelector('.chat-input-field');
        input.addEventListener('keydown', (e) => { if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); this.sendMessage(convId,otherId,input); } });
        win.querySelector('.send-btn').addEventListener('click', () => this.sendMessage(convId,otherId,input));
        try { await updateDoc(doc(db,'conversations',convId), { [`unread.${currentUser.uid}`]:0 }); } catch {}
        this.loadMessages(convId,otherId);
    },
    loadMessages(convId,otherId) {
        if (this.listeners[convId]) this.listeners[convId]();
        const body = document.querySelector(`.chat-window-body[data-conv="${convId}"]`); if (!body) return;
        const q = query(collection(db,'conversations',convId,'messages'),orderBy('createdAt','asc'));
        this.listeners[convId] = onSnapshot(q, (snap) => {
            if (snap.empty) { body.innerHTML = '<p style="text-align:center;color:#90949c;font-size:13px;padding:20px">No messages yet. Say hi! 👋</p>'; return; }
            body.innerHTML = snap.docs.map(d => {
                const m = d.data();
                const sent = m.senderId === currentUser.uid;
                const reactions = m.reactions || {};
                const counts = {};
                Object.values(reactions).forEach(e => counts[e] = (counts[e]||0)+1);
                const reactionHTML = Object.keys(counts).length ? `<div class="chat-msg-reactions ${sent?'sent':''}">${Object.entries(counts).map(([e,c]) => `<span class="chat-reaction-badge" data-msg-id="${d.id}">${e}${c>1?`<span class="count">${c}</span>`:''}</span>`).join('')}</div>` : '';
                const replyHTML = m.replyTo ? `<div class="chat-reply-quote"><strong>${esc(m.replyTo.senderName)}</strong>${esc((m.replyTo.text||'').substring(0,80))}</div>` : '';
                return `<div class="chat-msg-wrapper ${sent?'sent':'received'}" data-msg-id="${d.id}">
                    <div class="chat-msg ${sent?'sent':'received'}">${replyHTML}${linkify(m.text)}<span class="time">${timeAgo(m.createdAt)}</span></div>
                    <div class="chat-msg-actions">
                        <button class="chat-msg-action-btn" data-action="react" data-msg="${d.id}" title="React">😊</button>
                        <button class="chat-msg-action-btn" data-action="reply" data-msg="${d.id}" title="Reply">↩</button>
                    </div>
                    ${reactionHTML}
                </div>`;
            }).join('');
            body.scrollTop = body.scrollHeight;
            body.querySelectorAll('[data-action="react"]').forEach(btn => { btn.addEventListener('click', (e) => { e.stopPropagation(); Chat.showReactionPicker(btn, convId, btn.dataset.msg); }); });
            body.querySelectorAll('[data-action="reply"]').forEach(btn => { btn.addEventListener('click', (e) => { e.stopPropagation(); Chat.replyToMessage(convId, otherId, btn.dataset.msg); }); });
            body.querySelectorAll('.chat-msg-wrapper').forEach(w => {
                let pressTimer;
                w.addEventListener('touchstart', () => { pressTimer = setTimeout(() => { w.classList.add('show-actions'); }, 450); }, { passive: true });
                w.addEventListener('touchend', () => clearTimeout(pressTimer));
                w.addEventListener('touchmove', () => clearTimeout(pressTimer));
                w.addEventListener('click', (ev) => { if (ev.target.closest('.chat-msg-action-btn') || ev.target.closest('.chat-msg-reactions')) return; document.querySelectorAll('.chat-msg-wrapper.show-actions').forEach(x => { if (x !== w) x.classList.remove('show-actions'); }); });
            });
        });
    },
    showReactionPicker(btnEl, convId, msgId) {
        document.querySelectorAll('.chat-reaction-picker').forEach(p => p.remove());
        const picker = document.createElement('div');
        picker.className = 'chat-reaction-picker';
        picker.innerHTML = CHAT_REACTIONS.map(e => `<button data-emoji="${e}">${e}</button>`).join('');
        document.body.appendChild(picker);
        const rect = btnEl.getBoundingClientRect();
        const pw = 6 * 44;
        let left = rect.left + rect.width/2 - pw/2;
        left = Math.max(8, Math.min(left, window.innerWidth - pw - 8));
        let top = rect.top - 56;
        if (top < 8) top = rect.bottom + 8;
        picker.style.top = top + 'px';
        picker.style.left = left + 'px';
        picker.querySelectorAll('button').forEach(b => { b.addEventListener('click', async (ev) => { ev.stopPropagation(); await Chat.setMessageReaction(convId, msgId, b.dataset.emoji); picker.remove(); }); });
        setTimeout(() => {
            const close = (ev) => { if (!picker.contains(ev.target)) { picker.remove(); document.removeEventListener('click', close); document.removeEventListener('touchstart', close); } };
            document.addEventListener('click', close);
            document.addEventListener('touchstart', close);
        }, 60);
    },
    async setMessageReaction(convId, msgId, emoji) {
        try {
            const ref = doc(db, 'conversations', convId, 'messages', msgId);
            const snap = await getDoc(ref);
            if (!snap.exists()) return;
            const reactions = snap.data().reactions || {};
            if (reactions[currentUser.uid] === emoji) { delete reactions[currentUser.uid]; }
            else { reactions[currentUser.uid] = emoji; }
            await updateDoc(ref, { reactions });
        } catch(e) { toast('Error: ' + e.message, 'error'); }
    },
    async replyToMessage(convId, otherId, msgId) {
        try {
            const msgRef = doc(db, 'conversations', convId, 'messages', msgId);
            const snap = await getDoc(msgRef);
            if (!snap.exists()) return;
            const msg = snap.data();
            const senderSnap = await getDoc(doc(db, 'users', msg.senderId));
            const senderName = senderSnap.exists() ? `${senderSnap.data().prenom} ${senderSnap.data().nom}` : 'User';
            const win = document.querySelector(`.chat-window[data-conv="${convId}"]`);
            if (!win) return;
            const input = win.querySelector('.chat-input-field');
            const inputBar = win.querySelector('.chat-window-input');
            win.querySelectorAll('.chat-reply-preview').forEach(p => p.remove());
            const preview = document.createElement('div');
            preview.className = 'chat-reply-preview';
            preview.innerHTML = `<div class="crp-bar"></div><div class="crp-content"><strong>↩ Replying to ${esc(senderName)}</strong><div class="crp-text">${esc((msg.text||'').substring(0,100))}</div></div><button class="crp-close" title="Cancel">✕</button>`;
            win.insertBefore(preview, inputBar);
            input.dataset.replyToId = msgId;
            input.dataset.replyToText = (msg.text||'').substring(0,100);
            input.dataset.replyToSender = senderName;
            input.focus();
            preview.querySelector('.crp-close').addEventListener('click', () => { preview.remove(); delete input.dataset.replyToId; delete input.dataset.replyToText; delete input.dataset.replyToSender; });
        } catch(e) {}
    },
    async sendMessage(convId, otherId, inputEl) {
        const text = inputEl.value.trim();
        const replyToId = inputEl.dataset.replyToId;
        const replyToText = inputEl.dataset.replyToText;
        const replyToSender = inputEl.dataset.replyToSender;
        if (!text) return;
        inputEl.value = '';
        delete inputEl.dataset.replyToId;
        delete inputEl.dataset.replyToText;
        delete inputEl.dataset.replyToSender;
        const win = inputEl.closest('.chat-window');
        win.querySelectorAll('.chat-reply-preview').forEach(p => p.remove());
        const msgData = { senderId: currentUser.uid, text, createdAt: serverTimestamp(), reactions: {} };
        if (replyToId) { msgData.replyTo = { id: replyToId, text: replyToText, senderName: replyToSender }; }
        try {
            await addDoc(collection(db,'conversations',convId,'messages'), msgData);
            await updateDoc(doc(db,'conversations',convId), { lastMessage:text, lastMessageAt:serverTimestamp(), [`unread.${otherId}`]:increment(1) });
            await createNotification({ userId:otherId, type:'message', fromUserId:currentUser.uid, message:'sent you a message', preview:text.substring(0,60) });
        } catch(e) { toast('Error: ' + e.message, 'error'); }
    },
    minimize(convId) { const w = document.querySelector(`.chat-window[data-conv="${convId}"]`); if (w) { w.classList.toggle('minimized'); if (this.openWindows[convId]) this.openWindows[convId].minimized = w.classList.contains('minimized'); } },
    close(convId) { if (this.listeners[convId]) { this.listeners[convId](); delete this.listeners[convId]; } document.querySelector(`.chat-window[data-conv="${convId}"]`)?.remove(); delete this.openWindows[convId]; },
    closeAll() { Object.keys(this.openWindows).forEach(id => this.close(id)); }
};
let _chatConvsUnsub = null;
function loadChatConversations() {
    const list = document.getElementById('chat-conversations-list'); if (!list) return;
    if (_chatConvsUnsub) _chatConvsUnsub();

    _chatConvsUnsub = onSnapshot(q, async (snap) => {
        const convs = [];
        for (const d of snap.docs) { const data = d.data(); const otherId = data.participants.find(p => p !== currentUser.uid); const u = await getDoc(doc(db,'users',otherId)); convs.push({ id:d.id, ...data, other: u.exists()?{id:otherId,...u.data()}:{id:otherId,prenom:'?',nom:'?'} }); }
        convs.sort((a,b) => (b.lastMessageAt?.toMillis?.()||0) - (a.lastMessageAt?.toMillis?.()||0));

}

function setupGlobalSearch() {
    const searchInput = document.getElementById('search-input');
    const dropdown = document.getElementById('search-dropdown');
    if (!searchInput || !dropdown) return;

    const newSearchInput = searchInput.cloneNode(true);
    searchInput.parentNode.replaceChild(newSearchInput, searchInput);

    newSearchInput.addEventListener('input', async (e) => {
        const queryText = e.target.value.trim().toLowerCase();
        dropdown.innerHTML = '';

        if (queryText.length < 2) {
            dropdown.classList.remove('active');
            return;
        }
        
        SearchHistory.add(queryText);

        dropdown.innerHTML = '<div class="search-no-result">Searching...</div>';
        dropdown.classList.add('active');

        try {
            const usersRef = collection(db, 'users');
            const snapshot = await getDocs(query(usersRef, limit(1000)));

            const results = [];
            snapshot.forEach(doc => {
                const data = doc.data();
                const fullName = `${data.prenom || ''} ${data.nom || ''}`.toLowerCase();
                const matricule = (data.cardNumber || '').toLowerCase();

                if (fullName.includes(queryText) || matricule.includes(queryText)) {
                    results.push({ id: doc.id, ...data });
                }
            });

            if (results.length === 0) {
                dropdown.innerHTML = '<div class="search-no-result">No users found</div>';
                return;
            }

            dropdown.innerHTML = results.slice(0, 10).map(u => `
                <div class="search-result-item" onclick="location.hash='#/profile/${u.id}'; document.getElementById('search-dropdown').classList.remove('active'); document.getElementById('search-input').value = '';">
                    <img src="${u.photo || initialsAvatar(u.prenom, u.nom)}">
                    <div class="sr-info">
                        <div class="sr-name">${esc(u.prenom)} ${esc(u.nom)}</div>
                        <div class="sr-role">${u.role === 'student' ? 'Student' : u.role === 'teacher' ? 'Teacher' : 'Staff'}</div>
                    </div>
                </div>
            `).join('');

        } catch (err) {
            console.error("Search error:", err);
            dropdown.innerHTML = '<div class="search-no-result">Error searching users</div>';
        }
    });

    if (!window._globalSearchClickAttached) {
        window._globalSearchClickAttached = true;
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.search-dropdown') && e.target.id !== 'search-input') {
                document.getElementById('search-dropdown')?.classList.remove('active');
            }
            if (!e.target.closest('.mobile-search-wrap')) {
                document.getElementById('mobile-search-dropdown')?.classList.remove('active');
            }
        });
    }
}

const Router = {
    routes: {},
    register(path, handler) { this.routes[path] = handler; },
    navigate(path) { const newHash = '#' + path; if (window.location.hash === newHash) { this.handle(); } else { window.location.hash = newHash; } },
    async handle() {
        showLoading(); closeNotifPanel(); closeMobileDrawer();
        const hash = window.location.hash.replace(/^#/, '') || '/';
        try {
            if (hash.startsWith('/profile/')) { await Router.routes['/profile'](hash.split('/')[2]); return; }
            if (hash.startsWith('/group/')) { await Router.routes['/group'](hash.split('/')[2]); return; }
            if (hash.startsWith('/event/')) { await Router.routes['/event'](hash.split('/')[2]); return; }
            const handler = Router.routes[hash] || Router.routes['/'];
            await handler();
        } finally { hideLoading(); }
    }
};

async function runImport(raw) {
    const resultsEl = document.getElementById('import-results');
    const btn = document.getElementById('import-btn');
    btn.disabled = true; btn.textContent = 'Importing...';
    const lines = raw.split('\n').map(l => l.trim()).filter(l => l && !l.startsWith('#'));
    const users = [], parseErrors = [];
    
    for (const line of lines) {
        const parts = line.split('|').map(s => s.trim());
        if (parts.length < 5) { parseErrors.push({ line, error: 'Expected at least 5 fields' }); continue; }
        
        const [prenom, nom, dateNaissance, cardNumber, role, niveau, groupe, email] = parts;
        
        if (!prenom || !nom || !dateNaissance || !cardNumber || !role) { parseErrors.push({ line, error: 'Empty required field' }); continue; }
        const r = role.toLowerCase();
        if (!['student','teacher','worker','admin'].includes(r)) { parseErrors.push({ line, error: `Invalid role "${role}"` }); continue; }
        if (normalizeDOB(dateNaissance).length < 6) { parseErrors.push({ line, error: 'Date of birth must contain ≥6 digits' }); continue; }
        
        users.push({ 
            prenom, nom, dateNaissance, cardNumber, role: r, 
            niveau: niveau || null, 
            groupe: groupe || null,
            email: email || cardToEmail(cardNumber)
        });
    }
    
    if (!users.length) {
        resultsEl.innerHTML = `<div class="error-msg">❌ ${parseErrors.length} line(s) invalid — check the format.</div>`;
        btn.disabled = false; btn.textContent = '📥 Import Users'; return;
    }
    resultsEl.innerHTML = `<div class="loading">Importing ${users.length} user(s)...</div>`;
    const appName = 'igee-import-' + Date.now();
    let secondaryApp;
    try { secondaryApp = initializeApp(firebaseConfig, appName); }
    catch(e) { resultsEl.innerHTML = `<div class="error-msg">Init error: ${e.message}</div>`; btn.disabled = false; btn.textContent = '📥 Import Users'; return; }
    const secondaryAuth = getAuth(secondaryApp);
    const successes = [], failures = [];
    
    for (const u of users) {
        try {
            try { await signOut(secondaryAuth); } catch(e) {}
            const cred = await createUserWithEmailAndPassword(secondaryAuth, u.email, normalizeDOB(u.dateNaissance));
            await updateProfile(cred.user, { displayName: `${u.prenom} ${u.nom}` });
            
            await setDoc(doc(db, 'users', cred.user.uid), {
                prenom: u.prenom, nom: u.nom, email: u.email, role: u.role,
                cardNumber: u.cardNumber, dateNaissance: u.dateNaissance,
                bio: u.role === 'student' ? 'IGEE Student' : (u.role === 'worker' ? 'IGEE Staff / Worker' : `${u.role} at IGEE`),
                photo: null, savedPosts: [], isAdmin: u.role === 'admin',
                institut: 'IGEE', 
                niveau: u.niveau, 
                groupe: u.groupe,
                createdAt: serverTimestamp()
            });
            
            await setDoc(doc(db, 'allowed_cards', u.cardNumber), {
                cardNumber: u.cardNumber, prenom: u.prenom, nom: u.nom,
                role: u.role, dateNaissance: u.dateNaissance, email: u.email,
                used: true, uid: cred.user.uid, createdAt: serverTimestamp()
            });
            successes.push(u);
        } catch(err) {
            failures.push({ ...u, error: err.code === 'auth/email-already-in-use' ? 'Card already exists' : err.message });
        }
    }
    try { await deleteApp(secondaryApp); } catch(e) {}
    
    resultsEl.innerHTML = `
        <div style="background:linear-gradient(135deg,#42b72a,#369b23);color:#fff;padding:14px 18px;border-radius:8px;margin-bottom:12px;">
            ✅ ${successes.length} account(s) created successfully
        </div>
        ${failures.length ? `<div style="background:#ffebe8;color:#c92a2a;padding:14px 18px;border-radius:8px;margin-bottom:12px;">
            ❌ ${failures.length} failure(s):
            <ul style="margin-top:8px;padding-left:20px;">${failures.map(f => `<li>${esc(f.prenom)} ${esc(f.nom)} (${esc(f.cardNumber)}): ${esc(f.error)}</li>`).join('')}</ul>
        </div>` : ''}
        ${parseErrors.length ? `<div style="background:#fff3cd;color:#856404;padding:14px 18px;border-radius:8px;">
            ⚠️ ${parseErrors.length} line(s) skipped (format)
        </div>` : ''}`;
    btn.disabled = false; btn.textContent = '📥 Import Users';
}

// NOUVELLE FONCTION : Mise à jour de masse des groupes
async function updateGroupsMassively() {
    const raw = document.getElementById('update-groups-data').value.trim();
    if (!raw) return toast('Colle d\'abord tes données', 'error');
    
    const btn = document.getElementById('update-groups-btn');
    btn.disabled = true; btn.textContent = 'Mise à jour en cours...';
    
    const lines = raw.split('\n').map(l => l.trim()).filter(l => l && !l.startsWith('#'));
    let successCount = 0;
    let failCount = 0;
    let errors = [];

    for (const line of lines) {
        const parts = line.split('|').map(s => s.trim());
        if (parts.length < 2) {
            errors.push(`Ligne ignorée : ${line}`);
            continue;
        }
        const cardNumber = parts[0];
        const groupe = parts[1];

        try {
            const q = query(collection(db, 'users'), where('cardNumber', '==', cardNumber));
            const snap = await getDocs(q);
            
            if (snap.empty) {
                failCount++;
                errors.push(`Étudiant introuvable : ${cardNumber}`);
                continue;
            }
            
            const docId = snap.docs[0].id;
            await updateDoc(doc(db, 'users', docId), { groupe: groupe });
            successCount++;
            
        } catch (err) {
            failCount++;
            errors.push(`Erreur carte ${cardNumber} : ${err.message}`);
        }
    }

    btn.disabled = false; btn.textContent = '🚀 Mettre à jour les groupes';
    
    document.getElementById('update-groups-results').innerHTML = `
        <div style="background:linear-gradient(135deg,#42b72a,#369b23);color:#fff;padding:14px 18px;border-radius:8px;margin-bottom:12px;">
            ✅ ${successCount} étudiant(s) mis à jour avec succès.
        </div>
        ${failCount > 0 ? `<div style="background:#ffebe8;color:#c92a2a;padding:14px 18px;border-radius:8px;margin-bottom:12px;">
            ❌ ${failCount} échec(s) :
            <ul style="margin-top:8px;padding-left:20px;max-height:150px;overflow-y:auto;">
                ${errors.map(e => `<li>${esc(e)}</li>`).join('')}
            </ul>
        </div>` : ''}
    `;
    toast('Mise à jour terminée !', 'success');
}

function loadCommentsRealtime(postId) {
    const container = document.querySelector(`.comments[data-comments="${postId}"] .comments-list`); if (!container) return;
    const q = query(collection(db,'comments'), where('postId','==',postId));
    onSnapshot(q, async (snap) => {
        const comments = snap.docs.map(d => ({ id:d.id, ...d.data() })); comments.sort((a,b) => (a.createdAt?.toMillis?.()||0)-(b.createdAt?.toMillis?.()||0));
        const html = [];
        for (const c of comments) {
            const u = await getDoc(doc(db,'users',c.userId));
            const author = u.exists()?u.data():{prenom:'?',nom:'?'};
            const isMine = c.userId === currentUser.uid;
            const reactions = c.reactions || {};
            const counts = {};
            Object.values(reactions).forEach(e => counts[e] = (counts[e]||0)+1);
            const reactionHTML = Object.keys(counts).length ?
                `<div class="comment-reactions">${Object.entries(counts).map(([e,ct]) => `<span class="comment-reaction-badge">${e}${ct>1?`<span class="count">${ct}</span>`:''}</span>`).join('')}</div>` : '';
            const replyHTML = c.replyTo ? `<div class="comment-reply-quote"><strong>${esc(c.replyTo.senderName||'')}</strong>${esc((c.replyTo.text||'').substring(0,80))}</div>` : '';
            html.push(`<div class="comment" data-comment-id="${c.id}"><div class="comment-main-row"><img class="hover-target" data-uid="${c.userId}" src="${author.photo||initialsAvatar(author.prenom,author.nom)}"><div class="comment-wrapper"><div class="bubble"><span class="name hover-target" data-uid="${c.userId}">${esc(author.prenom+' '+author.nom)}<span class="time">${timeAgo(c.createdAt)}</span></span>${replyHTML}${linkify(c.contenu)}${isMine?`<button class="comment-del-btn" data-comment="${c.id}">✕</button>`:''}</div><div class="comment-actions-inline"><button class="comment-action-btn" data-action="react-comment" data-comment="${c.id}" title="React">😊 React</button><button class="comment-action-btn" data-action="reply-comment" data-comment="${c.id}" title="Reply">↩ Reply</button></div>${reactionHTML}</div></div></div>`);
        }
        container.innerHTML = html.join('') || '<p style="font-size:13px;color:var(--text-secondary)">No comments</p>';
        const pe = document.querySelector(`.post[data-post-id="${postId}"]`); if (pe) { const s = pe.querySelector('.post-stats div:last-child'); if (s) s.textContent = `${comments.length} comment${comments.length>1?'s':''}`; }
        container.querySelectorAll('.comment-del-btn').forEach(btn => { btn.onclick = async (e) => { e.stopPropagation(); const ok = await confirmDialog('Delete this comment?', 'This cannot be undone.', 'Delete'); if (!ok) return; try { await deleteDoc(doc(db,'comments',btn.dataset.comment)); toast('Comment deleted','success'); } catch {} }; });
        container.querySelectorAll('[data-action="react-comment"]').forEach(btn => {
            btn.addEventListener('click', (e) => { e.stopPropagation(); showCommentReactionPicker(btn, postId, btn.dataset.comment); });
        });
        container.querySelectorAll('[data-action="reply-comment"]').forEach(btn => {
            btn.addEventListener('click', (e) => { e.stopPropagation(); replyToComment(postId, btn.dataset.comment); });
        });
        container.querySelectorAll('.comment').forEach(cm => {
            let pt;
            cm.addEventListener('touchstart', () => { pt = setTimeout(() => cm.classList.add('show-actions'), 450); }, { passive: true });
            cm.addEventListener('touchend', () => clearTimeout(pt));
            cm.addEventListener('touchmove', () => clearTimeout(pt));
        });
    });
}
function showCommentReactionPicker(btnEl, postId, commentId) {
    document.querySelectorAll('.comment-reaction-picker').forEach(p => p.remove());
    const picker = document.createElement('div');
    picker.className = 'comment-reaction-picker';
    picker.innerHTML = COMMENT_REACTIONS.map(e => `<button data-emoji="${e}">${e}</button>`).join('');
    document.body.appendChild(picker);
    const rect = btnEl.getBoundingClientRect();
    const pw = 6 * 38;
    let left = rect.left + rect.width/2 - pw/2;
    left = Math.max(8, Math.min(left, window.innerWidth - pw - 8));
    let top = rect.top - 48;
    if (top < 8) top = rect.bottom + 8;
    picker.style.top = top + 'px';
    picker.style.left = left + 'px';
    picker.querySelectorAll('button').forEach(b => {
        b.addEventListener('click', async (ev) => {
            ev.stopPropagation();
            await setCommentReaction(postId, commentId, b.dataset.emoji);
            picker.remove();
        });
    });
    setTimeout(() => {
        const close = (ev) => { if (!picker.contains(ev.target)) { picker.remove(); document.removeEventListener('click', close); document.removeEventListener('touchstart', close); } };
        document.addEventListener('click', close);
        document.addEventListener('touchstart', close);
    }, 60);
}
async function setCommentReaction(postId, commentId, emoji) {
    try {
        const ref = doc(db, 'comments', commentId);
        const snap = await getDoc(ref);
        if (!snap.exists()) return;
        const reactions = snap.data().reactions || {};
        if (reactions[currentUser.uid] === emoji) { delete reactions[currentUser.uid]; }
        else { reactions[currentUser.uid] = emoji; }
        await updateDoc(ref, { reactions });
    } catch(e) { toast('Error: ' + e.message, 'error'); }
}
async function replyToComment(postId, commentId) {
    try {
        const ref = doc(db, 'comments', commentId);
        const snap = await getDoc(ref);
        if (!snap.exists()) return;
        const c = snap.data();
        const uSnap = await getDoc(doc(db, 'users', c.userId));
        const senderName = uSnap.exists() ? `${uSnap.data().prenom} ${uSnap.data().nom}` : 'User';
        const form = document.querySelector(`.comment-form[data-post="${postId}"]`);
        if (!form) return;
        form.parentElement.querySelectorAll('.comment-reply-preview-comment').forEach(p => p.remove());
        const preview = document.createElement('div');
        preview.className = 'comment-reply-preview-comment';
        preview.innerHTML = `<div class="crp-content-comment"><strong>↩ Replying to ${esc(senderName)}</strong><div class="crp-text-comment">${esc((c.contenu||'').substring(0,80))}</div></div><button class="crp-close-comment" title="Cancel">✕</button>`;
        form.parentElement.insertBefore(preview, form);
        const input = form.querySelector('input');
        input.dataset.replyToId = commentId;
        input.dataset.replyToText = (c.contenu||'').substring(0,80);
        input.dataset.replyToSender = senderName;
        input.focus();
        preview.querySelector('.crp-close-comment').addEventListener('click', () => {
            preview.remove();
            delete input.dataset.replyToId;
            delete input.dataset.replyToText;
            delete input.dataset.replyToSender;
        });
    } catch(e) {}
}

function getClubIdentity(name) {

    if (n.includes('electronic')) return { emoji: '⚡', bg: 'linear-gradient(135deg,#ffc107,#f57c00)', label: 'Electronics' };
    if (n.includes('robot')) return { emoji: '🤖', bg: 'linear-gradient(135deg,#e91e63,#ad1457)' };
    if (n.includes('informatic') || n.includes('dev') || n.includes('code')) return { emoji: '💻', bg: 'linear-gradient(135deg,#42b72a,#1b5e20)' };
    if (n.includes('sport') || n.includes('foot')) return { emoji: '⚽', bg: 'linear-gradient(135deg,#009688,#004d40)' };
    if (n.includes('bde') || n.includes('bureau')) return { emoji: '🎓', bg: 'linear-gradient(135deg,#673ab7,#311b92)' };
    if (n.includes('admin')) return { emoji: '🛡️', bg: 'linear-gradient(135deg,#607d8b,#263238)' };
    if (n.includes('prof') || n.includes('teacher')) return { emoji: '👨‍🏫', bg: 'linear-gradient(135deg,#00bcd4,#006064)' };
    if (n.includes('club')) return { emoji: '🏆', bg: 'linear-gradient(135deg,#ffd700,#ff9800)' };
    return null;
}
