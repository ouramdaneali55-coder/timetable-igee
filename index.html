function renderAnnouncementsList(filter) {
    const list = document.getElementById('announcements-list'); if (!list) return;
    let items = [..._allAnnouncements];
    
    // --- FILTRE "MY SCHEDULE" ---
    if (filter === 'my-target') {
        const myLevel = currentUserData.niveau || 'L1';
        const myGroup = currentUserData.groupe || '';
        items = items.filter(a => {
            if (!a.targetLevel) return false;
            if (a.targetLevel !== myLevel) return false;
            if (a.targetGroup && a.targetGroup !== myGroup) return false;
            return true;
        });
    } else if (filter === 'urgent') {
        items = items.filter(a => a.priority === 'urgent');
    } else if (filter === 'high') {
        items = items.filter(a => a.priority === 'high');
    } else if (filter === 'pinned') {
        items = items.filter(a => a.pinned);
    }

    items.sort((a, b) => {
        if (!!b.pinned !== !!a.pinned) return b.pinned ? 1 : -1;
        const pOrder = { urgent: 0, high: 1, normal: 2 };
        const pa = pOrder[a.priority] ?? 2, pb = pOrder[b.priority] ?? 2;
        if (pa !== pb) return pa - pb;
        return (b.createdAt?.toMillis?.() || 0) - (a.createdAt?.toMillis?.() || 0);
    });

    if (!items.length) {
        list.innerHTML = `<div class="announcements-empty"><div class="emoji">📢</div><h3>No announcements ${filter !== 'all' ? 'in this category' : 'yet'}</h3><p>${currentUserData.isAdmin ? 'Click "New Announcement" to create the first one.' : 'Check back later for updates.'}</p></div>`;
        return;
    }

    const isAdmin = !!currentUserData.isAdmin;
    list.innerHTML = items.map(a => {
        const p = ANN_PRIORITY[a.priority] || ANN_PRIORITY.normal;
        const author = { prenom: a.creatorPrenom || 'IGEE', nom: a.creatorNom || 'Admin', photo: a.creatorPhoto };
        const avatar = author.photo || initialsAvatar(author.prenom, author.nom);
        
        // --- BADGES DE CIBLAGE ---
        let targetBadges = '';
        if (a.targetLevel) {
            let audienceText = a.targetLevel;
            if (a.targetField) audienceText += ` - ${a.targetField}`;
            if (a.targetGroup) audienceText += ` - ${a.targetGroup}`;
            targetBadges += `<span class="ann-target-badge audience">🎯 ${audienceText}</span>`;
        }
        if (a.targetRoom) {
            targetBadges += `<span class="ann-target-badge location">📍 ${a.targetRoom}</span>`;
        }
        if (a.targetDay || a.targetDate || a.targetTime) {
            let scheduleText = '';
            if (a.targetDay) scheduleText += a.targetDay;
            if (a.targetDate) {
                const d = new Date(a.targetDate);
                scheduleText += ` ${d.toLocaleDateString('fr-FR')}`; 
            }
            if (a.targetTime) scheduleText += ` à ${a.targetTime}`;
            targetBadges += `<span class="ann-target-badge schedule">📅 ${scheduleText}</span>`;
        }

        return `<div class="announcement-card ${p.cls}" data-ann-id="${a.id}">
            <div class="announcement-head">
                <span class="announcement-priority ${p.cls}">${p.icon} ${p.label}</span>
                ${a.pinned ? '<span class="announcement-pin-badge">📌 Pinned</span>' : ''}
            </div>
            <div class="announcement-title">${esc(a.title)}</div>
            ${targetBadges ? `<div class="announcement-target-badges">${targetBadges}</div>` : ''}
            <div class="announcement-content">${linkify(a.content)}${a.image ? `<img src="${a.image}">` : ''}</div>
            <div class="announcement-meta">
                <div class="announcement-author"><img src="${avatar}"><span>${esc(author.prenom + ' ' + author.nom)}</span></div>
                <span>🕐 ${timeAgo(a.createdAt)}</span>
                ${isAdmin ? `<div class="announcement-actions-row">
                    <button class="announcement-pin-btn ${a.pinned ? 'active' : ''}" data-ann-pin="${a.id}" data-pin="${a.pinned ? '1' : '0'}">${a.pinned ? '📌 Unpin' : '📌 Pin'}</button>
                    <button class="announcement-delete-btn" data-ann-del="${a.id}">🗑️ Delete</button>
                </div>` : ''}
            </div>
        </div>`;
    }).join('');
    
    list.querySelectorAll('[data-ann-del]').forEach(btn => {
        btn.addEventListener('click', async (e) => {
            e.stopPropagation();
            const ok = await confirmDialog('Delete this announcement?', 'This action cannot be undone.', 'Delete');
            if (!ok) return;
            try { await deleteDoc(doc(db, 'announcements', btn.dataset.annDel)); toast('Announcement deleted', 'success'); } catch(err) { toast('Error: ' + err.message, 'error'); }
        });
    });
    list.querySelectorAll('[data-ann-pin]').forEach(btn => {
        btn.addEventListener('click', async (e) => {
            e.stopPropagation();
            const isPinned = btn.dataset.pin === '1';
            try { await updateDoc(doc(db, 'announcements', btn.dataset.annPin), { pinned: !isPinned }); toast(!isPinned ? '📌 Pinned' : 'Unpinned', 'success'); } catch(err) { toast('Error: ' + err.message, 'error'); }
        });
    });
}

function getSubjectInfo(promotion, categoryValue) {
    const subjects = PROMOTION_SUBJECTS[promotion] || [];
    const found = subjects.find(s => s.value === categoryValue);
    if (found) return found;
    for (const p of Object.values(PROMOTION_SUBJECTS)) {
        const f = p.find(s => s.value === categoryValue);
        if (f) return f;
    }
    return { value: categoryValue || 'other', label: categoryValue || 'Other', icon: '📚' };
}

function getPromotionColor(promo) {
    return (BOOK_PROMOTIONS[promo] && BOOK_PROMOTIONS[promo].color) || '#607d8b';
}

async function renderLibrary() {
    const me = currentUserData; if (!me) return;
    
    currentPromoFilter = 'all';
    currentLibFilter = 'all';
    currentLibSearch = '';

    document.getElementById('app').innerHTML = `
        ${navbarHTML(me, 'library')}
        <div class="container" style="grid-template-columns:280px 1fr;">
            ${sidebarLeftHTML(me, 'library')}
            <div>
                <div class="library-hero">
                    <div class="hero-icon">📚</div>
                    <h1>Digital Library</h1>
                    <p>Books, courses and PDF documents shared by the IGEE community</p>
                </div>
                <div class="library-toolbar">
                    <div class="library-filters" id="library-promo-filters" style="width:100%;margin-bottom:8px;">
                        <button class="library-filter active" data-promo-filter="all">🎓 All Promotions</button>
                        ${Object.entries(BOOK_PROMOTIONS).map(([k,p]) => `<button class="library-filter" data-promo-filter="${k}">${p.icon} ${p.label}</button>`).join('')}
                    </div>
                </div>
                <div class="library-toolbar">
                    <div class="library-filters" id="library-subject-filters">
                        <button class="library-filter active" data-lib-filter="all">📚 All Subjects</button>
                    </div>
                    <button class="btn-upload-book" id="upload-book-btn">+ Add a Book</button>
                </div>
                <div class="library-search-wrap">
                    <input type="text" id="library-search" placeholder="🔍 Search by title, author or description...">
                </div>
                <div class="library-grid" id="library-grid"><div class="loading">Loading...</div></div>
            </div>
        </div>`;
    attachHomeEvents(true);
    document.getElementById('upload-book-btn')?.addEventListener('click', createBook);

    function updateSubjectFilters() {
        const container = document.getElementById('library-subject-filters');
        if (!container) return;
        const promo = currentPromoFilter;
        let subjects = [];
        if (promo === 'all') {
            const seen = new Set();
            Object.values(PROMOTION_SUBJECTS).forEach(arr => arr.forEach(s => { if (!seen.has(s.value)) { seen.add(s.value); subjects.push(s); } }));
        } else {
            subjects = PROMOTION_SUBJECTS[promo] || [];
        }
        let html = `<button class="library-filter ${currentLibFilter==='all'?'active':''}" data-lib-filter="all">📚 All Subjects</button>`;
        html += subjects.map(s => `<button class="library-filter ${currentLibFilter===s.value?'active':''}" data-lib-filter="${s.value}">${s.icon} ${s.label}</button>`).join('');
        container.innerHTML = html;
        container.querySelectorAll('[data-lib-filter]').forEach(btn => {
            btn.addEventListener('click', () => {
                container.querySelectorAll('[data-lib-filter]').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentLibFilter = btn.dataset.libFilter;
                renderLibraryList();
            });
        });
    }

    document.querySelectorAll('[data-promo-filter]').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('[data-promo-filter]').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentPromoFilter = btn.dataset.promoFilter;
            currentLibFilter = 'all';
            updateSubjectFilters();
            renderLibraryList();
        });
    });

    updateSubjectFilters();

    document.getElementById('library-search')?.addEventListener('input', (e) => {
        currentLibSearch = e.target.value.toLowerCase().trim();
        renderLibraryList();
    });
    loadLibraryRealtime();
}

function loadLibraryRealtime() {
    const grid = document.getElementById('library-grid'); if (!grid) return;
    if (_libUnsub) _libUnsub();
    const q = query(collection(db, 'books'), orderBy('createdAt', 'desc'), limit(200));
    _libUnsub = onSnapshot(q, (snap) => {
        _allBooks = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        renderLibraryList();
    }, () => {
        grid.innerHTML = `<div class="library-empty" style="grid-column:1/-1;"><div class="emoji">📚</div><h3>Cannot load library</h3><p>Please check your connection.</p></div>`;
    });
}

function renderLibraryList() {
    const grid = document.getElementById('library-grid'); if (!grid) return;
    let items = [..._allBooks];
    if (currentPromoFilter !== 'all') items = items.filter(b => b.promotion === currentPromoFilter);
    if (currentLibFilter !== 'all') items = items.filter(b => b.category === currentLibFilter);
    if (currentLibSearch) {
        const s = currentLibSearch;
        items = items.filter(b =>
            (b.title||'').toLowerCase().includes(s) ||
            (b.author||'').toLowerCase().includes(s) ||
            (b.description||'').toLowerCase().includes(s)
        );
    }
    if (!items.length) {
        grid.innerHTML = `<div class="library-empty" style="grid-column:1/-1;"><div class="emoji">📚</div><h3>${_allBooks.length === 0 ? 'Library is empty' : 'No results'}</h3><p>${_allBooks.length === 0 ? 'Be the first to add a book!' : 'Try another search or filter.'}</p></div>`;
        return;
    }
    grid.innerHTML = items.map(b => bookCardHTML(b)).join('');
    grid.querySelectorAll('.library-card').forEach((card, i) => {
        card.addEventListener('click', () => openBookDetail(items[i]));
    });
}

function bookCardHTML(b) {

    return `<div class="library-card" data-book-id="${b.id}">

}

async function createBook() {
    const me = currentUserData;
    const data = await openFormModal('📚 Add a Book', `
        <label>Promotion *</label>
        <select name="promotion" id="book-promotion-select" required>
            ${Object.entries(BOOK_PROMOTIONS).map(([k,p]) => `<option value="${k}">${p.icon} ${p.label}</option>`).join('')}
        </select>
        <label>Subject *</label>
        <select name="category" id="book-subject-select" required></select>
        <label>Title *</label>
        <input type="text" name="title" placeholder="Ex: Linear Algebra - Course" required maxlength="150">
        <label>Author</label>
        <input type="text" name="author" placeholder="Ex: Pr. Ahmed Benali" maxlength="100">
        <label>Number of pages (optional)</label>
        <input type="number" name="pages" placeholder="Ex: 250" min="1" max="9999">
        <label>Description</label>
        <textarea name="description" placeholder="Short description..."></textarea>
        <label>Cover image (optional, max 500 KB)</label>
        <input type="file" name="cover" accept="image/*">
        <label>PDF file * (max 10 MB)</label>
        <input type="file" name="pdf" accept="application/pdf" required>
        <div class="btn-row">
            <button type="button" class="btn-cancel">Cancel</button>
            <button type="submit" class="btn-submit" style="background:linear-gradient(135deg,#673ab7,#311b92);">📤 Publish</button>
        </div>`, () => {
            const promoSelect = document.getElementById('book-promotion-select');
            const subjectSelect = document.getElementById('book-subject-select');
            if (!promoSelect || !subjectSelect) return;
            const updateSubjects = () => {
                const promo = promoSelect.value;
                const subjects = PROMOTION_SUBJECTS[promo] || [];
                subjectSelect.innerHTML = subjects.map(s => `<option value="${s.value}">${s.icon} ${s.label}</option>`).join('');
            };
            promoSelect.addEventListener('change', updateSubjects);
            updateSubjects();
        });
    if (!data) return;
    const pdfFile = data.pdf;
    const coverFile = data.cover;
    if (!pdfFile || !pdfFile.size) return toast('Please select a PDF file', 'error');
    if (pdfFile.size > 10 * 1024 * 1024) return toast('PDF too large (max 10 MB)', 'error');
    if (coverFile && coverFile.size > 500 * 1024) return toast('Image too large (max 500 KB)', 'error');
    if (CLOUDINARY_CLOUD_NAME === 'TON_CLOUD_NAME_ICI') return toast('Cloudinary not configured!', 'error');
    showLoading();
    try {
        const pdfRes = await uploadToCloudinary(pdfFile, 'igee_books/pdfs');
        const pdfUrl = pdfRes.secure_url;
        const pdfPublicId = pdfRes.public_id;
        let coverUrl = null;
        let coverPublicId = null;
        if (coverFile && coverFile.size) {
            const coverRes = await uploadToCloudinary(coverFile, 'igee_books/covers');
            coverUrl = coverRes.secure_url;
            coverPublicId = coverRes.public_id;
        }
        await addDoc(collection(db, 'books'), {
            title: (data.title || '').trim(),
            author: (data.author || '').trim(),
            promotion: data.promotion || 'L1',
            category: data.category || 'other',
            pages: data.pages ? parseInt(data.pages) : null,
            description: (data.description || '').trim(),
            cover: coverUrl,
            coverPublicId,
            pdfUrl,
            pdfPublicId,
            size: pdfFile.size,
            uploaderId: currentUser.uid,
            uploaderPrenom: me.prenom,
            uploaderNom: me.nom,
            uploaderPhoto: me.photo || null,
            createdAt: serverTimestamp()
        });
        hideLoading();
        toast('Book published successfully! 📚', 'success');
    } catch(err) {
        hideLoading();
        console.error('Cloudinary upload error:', err);
        toast('Upload error: ' + err.message, 'error');
    }
}

async function openBookDetail(book) {
    const modal = document.getElementById('book-detail-modal');
    const promo = book.promotion || 'L1';
    const promoColor = getPromotionColor(promo);
    const subj = getSubjectInfo(promo, book.category);
    const canDelete = book.uploaderId === currentUser.uid || currentUserData.isAdmin;
    const coverHTML = book.cover
        ? `<img src="${book.cover}" alt="${esc(book.title)}">`
        : `<div class="book-no-cover" style="background:linear-gradient(135deg,${promoColor},${promoColor}cc);"><span>${subj.icon}</span><small>${esc(subj.label)}</small></div>`;
    modal.innerHTML = `<div class="book-detail">
        <div class="book-detail-header">
            <button class="book-detail-close" id="book-detail-close-btn">✕</button>
            <div class="book-detail-cover">${coverHTML}</div>
            <div class="book-detail-info">
                <h2>${esc(book.title)}</h2>
                ${book.author ? `<div class="author">✍️ ${esc(book.author)}</div>` : ''}
                <span class="cat-pill" style="background:${promoColor};">🎓 ${esc(promo)} • ${subj.icon} ${esc(subj.label)}</span>
                <div class="meta-row">
                    ${book.pages ? `<span>📄 ${book.pages} pages</span>` : ''}
                    ${book.size ? `<span>💾 ${formatBytes(book.size)}</span>` : ''}
                    <span>📅 ${timeAgo(book.createdAt)}</span>
                </div>
            </div>
        </div>
        <div class="book-detail-body">
            ${book.description ? `<h4>Description</h4><div class="book-detail-desc">${esc(book.description)}</div>` : ''}
            <h4>Shared by</h4>
            <div class="book-detail-uploader">
                <img src="${book.uploaderPhoto || initialsAvatar(book.uploaderPrenom||'?',book.uploaderNom||'?')}">
                <span class="name">${esc((book.uploaderPrenom||'') + ' ' + (book.uploaderNom||''))}</span>
                <span class="time">${timeAgo(book.createdAt)}</span>
            </div>
            <div class="book-detail-actions">
                <a href="${book.pdfUrl}" target="_blank" rel="noopener noreferrer" class="btn-read">📖 Read PDF</a>
                <a href="${book.pdfUrl}" download="${esc(book.title)}.pdf" class="btn-download">⬇️ Download</a>
                ${canDelete ? `<button class="btn-delete-book" id="book-delete-btn">🗑️ Delete</button>` : ''}
            </div>
        </div>
    </div>`;
    modal.classList.add('active');
    document.body.style.overflow = 'hidden';
    const close = () => { modal.classList.remove('active'); document.body.style.overflow = ''; };
    
    document.getElementById('book-detail-close-btn').onclick = close;
    modal.onclick = (e) => { if (e.target === modal) close(); };
    
    document.getElementById('book-delete-btn')?.addEventListener('click', async () => {
        const ok = await confirmDialog('Delete this book?', 'This action is irreversible.', 'Delete');
        if (!ok) return;
        try {
            await deleteDoc(doc(db, 'books', book.id));
            toast('Book deleted', 'success');
            close();
        } catch(err) { toast('Error: ' + err.message, 'error'); }
    });
}

        ${me.isAdmin ? `<a href="#/admin/import" class="menu-item ${active==='admin'?'active':''}" style="${active==='admin'?'background:rgba(217,48,37,.15);color:#d93025;':''}"><span class="icon">👥</span> <strong>Import Users</strong></a>` : ''}
    </div>`;
}
function sidebarRightHTML() { return `<div class="sidebar sidebar-right"><h3>IGEE Members</h3><div id="members-list"><div class="loading">Loading...</div></div></div>`; }
function loadMembersRealtime() {
    const list = document.getElementById('members-list'); if (!list) return;
    const q = query(collection(db,'users'),limit(10));
    onSnapshot(q, (snap) => {
        const members = snap.docs.map(d => ({ id:d.id, ...d.data() })).filter(u => u.id !== currentUser.uid);
        list.innerHTML = members.map(u => `<a href="#/profile/${u.id}" class="menu-item"><img class="hover-target" data-uid="${u.id}" src="${u.photo||initialsAvatar(u.prenom,u.nom)}"><span class="hover-target" data-uid="${u.id}" style="font-size:14px">${esc(u.prenom+' '+u.nom)}</span></a>`).join('') || '<p style="font-size:13px;color:var(--text-secondary)">No members</p>';
    });
}

    setupGlobalSearch();
    document.getElementById('notif-bell')?.addEventListener('click', (e) => { e.stopPropagation(); toggleNotifPanel(); });
    document.getElementById('mbn-notif')?.addEventListener('click', () => toggleNotifPanel());
    document.getElementById('mark-all-read')?.addEventListener('click', (e) => { e.stopPropagation(); markAllNotifsRead(); });
    document.getElementById('messages-btn')?.addEventListener('click', (e) => { e.stopPropagation(); Chat.toggleSidebar(); });
    document.getElementById('mbn-messages')?.addEventListener('click', () => Chat.toggleSidebar());
    document.getElementById('sidebar-messages')?.addEventListener('click', () => Chat.toggleSidebar());
    document.getElementById('chat-fab')?.addEventListener('click', () => Chat.toggleSidebar());
    document.getElementById('close-chat-sidebar')?.addEventListener('click', () => Chat.closeSidebar());
    document.getElementById('theme-toggle-btn')?.addEventListener('click', () => Theme.toggle());
    document.addEventListener('click', (e) => { const w = document.querySelector('.notif-wrapper'); if (w && !w.contains(e.target)) closeNotifPanel(); });
    document.getElementById('mobile-menu-btn')?.addEventListener('click', openMobileDrawer);
    document.getElementById('mobile-drawer-close')?.addEventListener('click', closeMobileDrawer);
    document.getElementById('mobile-drawer-overlay')?.addEventListener('click', closeMobileDrawer);
    document.getElementById('mobile-drawer-messages')?.addEventListener('click', () => { closeMobileDrawer(); Chat.toggleSidebar(); });
    document.getElementById('mobile-drawer-logout')?.addEventListener('click', async () => { closeMobileDrawer(); await signOut(auth); Chat.closeAll(); toast('Logged out','success'); });
    document.querySelectorAll('#mobile-drawer a').forEach(a => a.addEventListener('click', closeMobileDrawer));
}
function attachHomeEvents(isMessages = false) {
    document.getElementById('logout-btn')?.addEventListener('click', async () => { await signOut(auth); Chat.closeAll(); toast('Logged out','success'); });
    attachNotifEvents();
    if (isMessages) return;
    const fileInput = document.getElementById('post-image');
    fileInput?.addEventListener('change', () => { document.getElementById('file-name').textContent = fileInput.files[0]?.name || ''; });
    document.getElementById('create-post-form')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const textarea = document.getElementById('post-textarea');
        const contenu = textarea.value.trim(); const file = fileInput.files[0];
        if (!contenu && !file) return toast('Write something','error');
        const btn = document.getElementById('publish-btn'); btn.disabled = true; btn.textContent = 'Posting...';
        try { let imageUrl = null; if (file) { if (file.size > 1024*1024) throw new Error('Image too large (max 1 MB)'); imageUrl = await uploadImage(file); } await addDoc(collection(db,'posts'), { userId:currentUser.uid, contenu, image: imageUrl, likes: [], reactions: {}, createdAt: serverTimestamp() }); textarea.value = ''; fileInput.value = ''; document.getElementById('file-name').textContent = ''; toast('Post published!','success'); } catch(err) { toast('Error: ' + err.message, 'error'); }
        btn.disabled = false; btn.textContent = 'Post';
    });
}
function attachPostEvents() {
    document.querySelectorAll('.like-btn').forEach(btn => {
        const postId = btn.dataset.post;
        const picker = document.querySelector(`.reaction-picker[data-picker="${postId}"]`);
        let hideTimeout;
        btn.onmouseenter = () => { if (picker) { clearTimeout(hideTimeout); document.querySelectorAll('.reaction-picker.active').forEach(p => { if (p !== picker) p.classList.remove('active'); }); picker.classList.add('active'); } };
        btn.onmouseleave = () => { hideTimeout = setTimeout(() => { if (picker) picker.classList.remove('active'); }, 300); };
        if (picker) { picker.onmouseenter = () => clearTimeout(hideTimeout); picker.onmouseleave = () => { picker.classList.remove('active'); }; }
        btn.onclick = async () => { await handleReaction(postId, 'like'); if (picker) picker.classList.remove('active'); };
    });
    document.querySelectorAll('.reaction-btn').forEach(rBtn => {
        rBtn.onclick = async (e) => { e.stopPropagation(); const postId = rBtn.dataset.post; const reaction = rBtn.dataset.reaction; await handleReaction(postId, reaction); document.querySelectorAll('.reaction-picker.active').forEach(p => p.classList.remove('active')); };
    });
    async function handleReaction(postId, reactionType) {
        try {
            const ref = doc(db, 'posts', postId);
            const snap = await getDoc(ref);
            if (!snap.exists()) return;
            const data = snap.data();
            const reactions = data.reactions || {};
            const likesArr = data.likes || [];
            const currentReaction = reactions[currentUser.uid] || (likesArr.includes(currentUser.uid) ? 'like' : null);
            if (currentReaction === reactionType) { delete reactions[currentUser.uid]; await updateDoc(ref, { reactions }); }
            else { reactions[currentUser.uid] = reactionType; await updateDoc(ref, { reactions }); if (!currentReaction && data.userId !== currentUser.uid) { await createNotification({ userId: data.userId, type: 'like', fromUserId: currentUser.uid, postId, message: 'reacted to your post' }); } }
            const newSnap = await getDoc(ref);
            if (newSnap.exists()) {
                const newData = { id: newSnap.id, ...newSnap.data() };
                const authorSnap = await getDoc(doc(db, 'users', newData.userId));
                const author = authorSnap.exists() ? { id: authorSnap.id, ...authorSnap.data() } : { prenom:'?', nom:'?' };
                const postEl = document.querySelector(`.post[data-post-id="${postId}"]`);
                if (postEl) { const temp = document.createElement('div'); temp.innerHTML = postHTML(newData, author); postEl.replaceWith(temp.firstElementChild); attachPostEvents(); attachLightboxListeners(); loadCommentsRealtime(postId); }
            }
        } catch(err) { toast('Error: ' + err.message, 'error'); }
    }
    document.querySelectorAll('.comment-toggle').forEach(btn => { btn.onclick = () => { const pid = btn.dataset.post; const z = document.querySelector(`.comments[data-comments="${pid}"]`); z.style.display = z.style.display === 'none' ? '' : 'none'; if (z.style.display !== 'none') z.querySelector('input')?.focus(); }; });
    document.querySelectorAll('.comment-form').forEach(form => {
        form.onsubmit = async (e) => {
            e.preventDefault();
            const pid = form.dataset.post;
            const input = form.querySelector('input');
            const contenu = input.value.trim();
            if (!contenu) return;
            const replyToId = input.dataset.replyToId;
            const replyToText = input.dataset.replyToText;
            const replyToSender = input.dataset.replyToSender;
            const commentData = { postId: pid, userId: currentUser.uid, contenu, reactions: {}, createdAt: serverTimestamp() };
            if (replyToId) { commentData.replyTo = { id: replyToId, text: replyToText, senderName: replyToSender }; }
            try {
                await addDoc(collection(db,'comments'), commentData);
                input.value = '';
                delete input.dataset.replyToId;
                delete input.dataset.replyToText;
                delete input.dataset.replyToSender;
                form.parentElement.querySelectorAll('.comment-reply-preview-comment').forEach(p => p.remove());
                const z = document.querySelector(`.comments[data-comments="${pid}"]`);
                if (z) z.style.display = '';
                const ps = await getDoc(doc(db,'posts',pid));
                if (ps.exists() && ps.data().userId !== currentUser.uid) {
                    await createNotification({ userId:ps.data().userId, type:'comment', fromUserId:currentUser.uid, postId:pid, message:'commented', preview: contenu.substring(0,60) });
                }
            } catch(err) {}
        };
    });
    document.querySelectorAll('.post-menu-btn').forEach(btn => { btn.onclick = (e) => { e.stopPropagation(); const pid = btn.dataset.post; const dd = document.querySelector(`.post-dropdown[data-dropdown="${pid}"]`); document.querySelectorAll('.post-dropdown.active').forEach(d => { if (d !== dd) d.classList.remove('active'); }); dd.classList.toggle('active'); }; });
    document.querySelectorAll('.dropdown-item').forEach(item => {
        item.onclick = async (e) => {
            e.stopPropagation();
            const action = item.dataset.action; const pid = item.dataset.post;
            document.querySelectorAll('.post-dropdown.active').forEach(d => d.classList.remove('active'));
            if (action === 'copy') { const url = window.location.origin + window.location.pathname + '#/home'; try { await navigator.clipboard.writeText(url); toast('Link copied!','success'); } catch {} }
            else if (action === 'save') { await toggleSavePost(pid); }
            else if (action === 'delete') { const ok = await confirmDialog('Delete this post?','Cannot be undone.','Delete'); if (!ok) return; try { const cQ = query(collection(db,'comments'),where('postId','==',pid)); const cS = await getDocs(cQ); await Promise.all(cS.docs.map(d => deleteDoc(doc(db,'comments',d.id)))); await deleteDoc(doc(db,'posts',pid)); toast('Post deleted','success'); } catch(err) {} }
        };
    });
    document.querySelectorAll('.share-btn').forEach(btn => { btn.onclick = async () => { const url = window.location.origin + window.location.pathname + '#/home'; try { if (navigator.share) await navigator.share({ title:'IGEE Social', url }); else { await navigator.clipboard.writeText(url); toast('Link copied!','success'); } } catch(e) {} }; });
    
    if (!window._postClickAttached) {
        window._postClickAttached = true;
        document.addEventListener('click', () => { document.querySelectorAll('.post-dropdown.active').forEach(d => d.classList.remove('active')); });
    }
}

async function toggleSavePost(postId) {
    try {
        const userRef = doc(db, 'users', currentUser.uid);
        const snap = await getDoc(userRef);
        if (!snap.exists()) return;
        const saved = snap.data().savedPosts || [];
        const isSaved = saved.includes(postId);
        if (isSaved) { await updateDoc(userRef, { savedPosts: arrayRemove(postId) }); toast('Removed from saved', 'success'); }
        else { await updateDoc(userRef, { savedPosts: arrayUnion(postId) }); toast('Saved! 🔖', 'saved'); }
        currentUserData.savedPosts = isSaved ? saved.filter(id => id !== postId) : [...saved, postId];
        const postEl = document.querySelector(`.post[data-post-id="${postId}"]`);
        if (postEl) {
            const ref = doc(db, 'posts', postId);
            const ps = await getDoc(ref);
            if (ps.exists()) {
                const data = { id: ps.id, ...ps.data() };
                const authorSnap = await getDoc(doc(db, 'users', data.userId));
                const author = authorSnap.exists() ? { id: authorSnap.id, ...authorSnap.data() } : { prenom:'?', nom:'?' };
                const temp = document.createElement('div'); temp.innerHTML = postHTML(data, author); postEl.replaceWith(temp.firstElementChild);
                attachPostEvents(); attachLightboxListeners(); loadCommentsRealtime(postId);
            }
        }
    } catch(err) { toast('Error: ' + err.message, 'error'); }
}

function attachProfileEvents(user) {
    document.getElementById('logout-btn')?.addEventListener('click', async () => { await signOut(auth); Chat.closeAll(); });
    const form = document.getElementById('profile-form'); if (!form) return;
    form.onsubmit = async (e) => {
        e.preventDefault();
        const fd = new FormData(form); const bio = fd.get('bio').trim(); const file = form.querySelector('input[type=file]').files[0];
        const updates = { bio }; const btn = document.getElementById('save-profile-btn'); btn.disabled = true; btn.textContent = 'Saving...';
        try { if (file) { if (file.size > 512*1024) throw new Error('Image too large (max 512 KB)'); updates.photo = await uploadImage(file); } await updateDoc(doc(db,'users',currentUser.uid), updates); toast('Profile updated!','success'); renderProfile(currentUser.uid); } catch(err) { toast('Error: ' + err.message, 'error'); }
        btn.disabled = false; btn.textContent = 'Save';
    };
}

Router.register('/groups', () => { if (!currentUser) Router.navigate('/'); else renderGroups(); });
Router.register('/group', (id) => { if (!currentUser) Router.navigate('/'); else renderGroupDetail(id); });

    if (!currentUser) return Router.navigate('/');
    if (!currentUserData?.isAdmin) { toast('Access denied', 'error'); return Router.navigate('/home'); }
    renderAdminImport();
});

window.addEventListener('hashchange', () => Router.handle());

onAuthStateChanged(auth, async (user) => {
    if (user) {
        currentUser = user;
        currentUserData = await loadUserData(user.uid);
        Theme.init();
        Lightbox.init();
        hoverCard.init(); attachHoverCards();
        await setupNotifications();
        watchUnreadMessages(user.uid);
        watchNotifications(user.uid);
        if (!window.location.hash || window.location.hash === '#/') Router.navigate('/home');
        else Router.handle();
    } else {
        currentUser = null; currentUserData = null;
        if (window._unreadMsgsUnsub) window._unreadMsgsUnsub();
        if (window._notifUnsub) window._notifUnsub();
        if (_annRealtimeUnsub) _annRealtimeUnsub();
        if (_homeAnnUnsub) _homeAnnUnsub();
        if (_libUnsub) _libUnsub();
        Chat.closeAll(); Router.navigate('/');
    }
});
